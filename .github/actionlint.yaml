# CAMP-134. Until 04.11.2026 this file taught actionlint one self-hosted
# label, `camptribe-data`, so scale-check.yml could say
# `runs-on: [self-hosted, camptribe-data]` without the "Workflow files
# parse and their scripts are sane" step refusing it.
#
# 🔴 The label is gone ON PURPOSE, and the empty list below is the guard.
# camp-tribe-eu/camp is public; a self-hosted runner for a public
# repository runs any pull request's checkout on the machine it stands
# on, and the only machine with the data this label promised holds the
# production database. The scale check moved to a systemd timer on that
# machine (infra/systemd/camptribe-scale-check.service). With no label
# known here, any workflow that reintroduces `runs-on: self-hosted`
# fails actionlint in ci.yml — which is what should happen to it.
self-hosted-runner:
  labels: []
