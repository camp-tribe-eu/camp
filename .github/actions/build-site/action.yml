name: Build the site with real data
description: >
  Migrate a PostGIS database, seed the CI fixture, start the API, and build
  the web app against it. Shared by every job that needs built pages.

# 🔴 CAMP-90. Without this the CI build reached no API, every fetch failed,
# and the site was generated with zero campsites. Each SEO check then either
# passed on an empty set or failed for a reason that had nothing to do with
# the code. A pipeline that builds nothing and reports green is worse than
# one that is honestly red.
#
# The `services:` block that provides Postgres has to live in the job — a
# composite action cannot declare one — so each job that uses this also
# declares the service. Everything after that is here, once.

inputs:
  site-mode:
    description: 'public or closed — drives robots, headers and meta'
    required: false
    default: 'closed'
  database-url:
    description: 'Connection string for the PostGIS service'
    required: false
    default: 'postgres://postgres:postgres@localhost:5432/camptribe_test'
  error-endpoint:
    description: >
      CAMP-92. Where the browser posts client errors. Baked into the
      bundle at build time, so it cannot be set later by `next start`.

      🔴 Empty by default, and only the e2e job passes a value. The
      endpoint's origin joins `connect-src`, so a default here would put
      `http://localhost:3001` into the Content-Security-Policy of the
      `public-build` job — the one job whose whole purpose is to be
      shaped exactly like production. A test fixture must not be able to
      widen the real policy.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Create the PostGIS extension
      shell: bash
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d camptribe_test \
          -c 'CREATE EXTENSION IF NOT EXISTS postgis;'

    - name: Run migrations
      shell: bash
      working-directory: apps/api
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      run: npx typeorm-ts-node-commonjs migration:run -d src/data-source.ts

    - name: Load the CI fixture
      shell: bash
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d camptribe_test -v ON_ERROR_STOP=1 \
          -f apps/api/test/fixtures/ci-seed.sql
        echo "campsites: $(psql -h localhost -U postgres -d camptribe_test -t -A \
          -c 'SELECT count(*) FROM camping_spots;')"

    # CAMP-66. Guides are DERIVED from the campsites above, so they are
    # generated here rather than written into the fixture by hand.
    #
    # 🔴 Written by hand they would be a lie in miniature: a guide saying
    # "15 of 20 campsites in Bovec" inside a fixture that holds no Bovec
    # is exactly the kind of number-that-matches-nothing this project
    # refuses to publish. Generated, they describe the rows that are
    # actually there — and the generator itself gets run on every commit
    # instead of only on my machine.
    #
    # Measured on a database built from this fixture: 72 campsites
    # support 4 guides at the 5-subject threshold.
    - name: Generate the guides the fixture supports
      shell: bash
      working-directory: apps/api
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      run: |
        npx ts-node src/guides/generate.ts --apply
        # 🔴 A generator that wrote nothing must fail here, not four jobs
        # later as "no guides are published". The guides section was
        # invisible to CI for exactly this reason until the disclosure
        # gate refused to pass on zero pages.
        count=$(psql "$DATABASE_URL" -t -A -c 'SELECT count(*) FROM guides;')
        echo "guides: $count"
        if [ "$count" -lt 1 ]; then
          echo "::error::the generator produced no guides from this fixture"
          exit 1
        fi

    - name: Start the API
      shell: bash
      working-directory: apps/api
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        # 🔴 Explicit, because main.ts defaults to 3000 and only reaches
        # 3001 through apps/api/.env — which is gitignored and therefore
        # does not exist here. The first CI run started the API perfectly
        # on 3000 while this step polled 3001 for sixty seconds. "Works
        # locally because of an untracked file" is the whole failure.
        #
        # 3000 would also collide with `next start`, which Lighthouse uses.
        PORT: '3001'
        # Two cards arrived at this same line, and both reasons hold.
        #
        # CAMP-92: the browser POSTs a client error cross-origin
        # (3000 → 3001), so the allowlist has to name the site.
        #
        # CAMP-60, debt #4: the allowlist is empty unless CORS_ORIGINS is
        # set — the right default, since an unconfigured machine stays
        # closed. But it also meant our only CORS assertion was negative
        # ("an unknown origin gets nothing"), which stays green when CORS
        # is switched off entirely, and when the API is not running at
        # all. Setting it here is what lets the test assert both
        # directions.
        CORS_ORIGINS: 'http://localhost:3000'
        # Reading errors back needs a token, and with none set the route
        # 404s. Throwaway and local to the runner; nothing here is secret.
        CLIENT_ERRORS_READ_TOKEN: 'ci-read-token'
        # 🔴 CAMP-69. The build is our heaviest legitimate caller — it
        # asks for every campsite — so it identifies itself and skips the
        # rate limit. Throwaway and local to the runner; the point is not
        # secrecy but that the PUBLIC does not have it.
        #
        # Without this the build is throttled and, because getSpot returns
        # null rather than throwing, it exits 0 with most of the site
        # missing. Measured: 580 campsite pages instead of 9 830.
        API_BUILD_TOKEN: 'ci-build-token'
      run: |
        npx nest start > /tmp/api.log 2>&1 &
        # The build fetches from it, so a race here would produce an empty
        # site that still exits 0 — wait for a real answer, not a sleep.
        for i in $(seq 1 60); do
          if curl -fsS http://localhost:3001/spots/countries > /dev/null 2>&1; then
            echo "API up after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "::error::API did not start in 60s"
        tail -40 /tmp/api.log
        exit 1

    - name: Build the web app
      shell: bash
      env:
        NEXT_PUBLIC_SITE_MODE: ${{ inputs.site-mode }}
        API_BASE_URL: http://localhost:3001
        NEXT_PUBLIC_ERROR_ENDPOINT: ${{ inputs.error-endpoint }}
        # The same token the API was started with. Server-side only: no
        # NEXT_PUBLIC_ prefix, so it never reaches the browser bundle.
        API_BUILD_TOKEN: 'ci-build-token'
      run: npm run build --workspace=apps/web

    - name: Refuse an incomplete build
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      run: |
        # The failure this whole action exists to prevent, asserted
        # directly: a build that reached no data still exits 0.
        #
        # 🔴 Against the number the API reports, not against 10.
        #
        # This compared with `-lt 10`, which answers "did the API reply at
        # all" and nothing else. CAMP-69 produced the case it cannot see:
        # rate limiting throttled the per-campsite fetches, `getSpot`
        # returned null rather than throwing — deliberately, a missing
        # campsite is a 404 — and the build exited 0 having written 580
        # campsite pages out of 9 830. Every one of those 580 was perfect.
        # The other 9 250 simply were not there, and `580 -gt 10` passed.
        #
        # A build missing 94% of the site is not a smaller site; it is a
        # site that has silently dropped most of its content while
        # reporting success.
        # 🔴 With the token: /spots/index is one of the rate-limited bulk
        # routes, and a guard that 429s itself would report a broken
        # build on every run.
        EXPECTED=$(curl -fsS -H 'x-build-token: ci-build-token' \
          "http://localhost:3001/spots/index" \
          | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).length))')
        BUILT=$(find apps/web/.next/server/app/camping \
          -name '*.html' -not -name 'page.html' | wc -l | tr -d ' ')
        echo "campsites the API lists: $EXPECTED"
        echo "campsite and hub pages built: $BUILT"

        if [ "$EXPECTED" -lt 1 ]; then
          echo "::error::the API lists no campsites at all — the fixture did not load"
          tail -40 /tmp/api.log
          exit 1
        fi
        # Hubs are built too, so BUILT is legitimately larger than
        # EXPECTED. What must never happen is BUILT falling below it.
        if [ "$BUILT" -lt "$EXPECTED" ]; then
          echo "::error::only $BUILT pages built for $EXPECTED campsites — pages were lost"
          tail -40 /tmp/api.log
          exit 1
        fi
