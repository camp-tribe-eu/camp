name: Scale check

# CAMP-134. The questions that only have answers on 61 557 campsites —
# and, since 04.11.2026, only the LOGIC of them runs here.
#
# 🔴 WHAT THIS WORKFLOW NO LONGER IS.
#
# Until 04.11.2026 this file said `runs-on: [self-hosted, camptribe-data]`
# and ran the probes, a full site build and a browser pass on "the
# machine that holds the database". Two facts ended that:
#
#  1. camp-tribe-eu/camp is PUBLIC. A self-hosted runner for a public
#     repository executes whatever a pull request's checkout contains —
#     `npm ci` lifecycle scripts first of all — on the machine it stands
#     on, and that machine holds the production database of personal
#     data and apps/api/.env. GitHub's own documentation says self-hosted
#     runners should almost never be used with public repositories. The
#     `labeled`-only trigger narrowed the window; it did not close it.
#  2. No such runner was ever registered. Every nightly queued for the
#     label, waited, and was cancelled: measured 04.11.2026 with
#     `gh run list --workflow=scale-check.yml --limit 100`, 77 runs in
#     all — 70 cancelled, 7 skipped, 0 successful. The mechanism had not
#     run ONCE in five weeks while looking like coverage.
#
# The probes now run from a systemd timer ON the machine, reading its own
# API over its own database and running no code that did not arrive by a
# merged release: infra/systemd/camptribe-scale-check.{service,timer},
# 02:00 UTC nightly. Failure there is a letter to the owner through
# camptribe-failed@; a disabled timer is caught by camptribe-infra-drift.
#
# 🔴 WHAT STAYS HERE, AND WHY IT IS WORTH A WORKFLOW.
#
# The checks have two halves: logic (how the pipeline script is read, how
# columns are priced, which chunks are sampled, whether the scale gate
# shuts on a fixture) and data (the census over 797 MB of extracts, the
# index over 812 regions). The data half can only run where the data is.
# The logic half needs nothing, and it is what a pull request changes —
# so it runs on every PR, on GitHub's runners, with no secret, no `.env`
# and no `npm ci`: the three scripts import only node builtins.
#
# docs/scale-check.md has the decision, what each stage costs, and which
# of the six defects each stage provably catches.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      # `node-version-file` rather than a literal: it cannot drift from
      # .nvmrc, because it is .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # 🔴 Every step below reads the self-test's own output, under
      # `set -o pipefail`, for a line that names its own script
      # (CAMP-285/286): "did not start" and "every case passed" otherwise
      # print the same thing — nothing, exit 0.

      # The pipeline script is read the way the live census reads it, and
      # the columns are priced against the census measured 27.09.2026:
      # the allowlist removed must die at EU-27 and pass at three
      # countries; include_tags→exclude_tags must die; an unknown key is
      # not a pass.
      - name: The OSM column check still prices the pipeline correctly
        run: |
          set -o pipefail
          node scripts/scale-check/check-osm-columns.mjs --self-test --offline | tee /dev/stderr \
            | grep -c 'check-osm-columns self-test:' >/dev/null

      # The chunk sample the map probe compares: deterministic, never
      # without the biggest region, and the n=0 collapse the probe asserts
      # against.
      - name: The map probe still samples the chunks it claims to
        run: |
          set -o pipefail
          node scripts/scale-check/check-map-index.mjs --self-test --offline | tee /dev/stderr \
            | grep -c 'check-map-index self-test:' >/dev/null

      # The scale gate in run.sh, driven against a stub API: shuts on a
      # fixture, on a non-number, on a 429 and on silence; opens on
      # 61 557 and prints the number the journal will carry; and the
      # token never reaches the output.
      - name: The scale gate still shuts on a fixture and opens on the dataset
        run: |
          set -o pipefail
          node scripts/scale-check/run.selftest.mjs | tee /dev/stderr \
            | grep -c 'scale-check run.sh self-test:' >/dev/null
