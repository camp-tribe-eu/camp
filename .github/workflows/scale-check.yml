name: Scale check

# CAMP-134. The questions that only have answers on 61 557 campsites.
#
# 🔴 WHY THIS IS A SEPARATE WORKFLOW AND NOT MORE STEPS IN ci.yml.
#
# On 25.09.2026 six defects out of eighteen shared one cause: each was
# invisible on CI's fixture of 72 campsites and obvious on the full data.
# CI stayed green through all six. Twice it was the other way round — the
# test failed BECAUSE the data was small, and would have passed on the
# real thing. So the fixture does not merely miss defects, it invents
# them.
#
# It is not a testing gap. The tests are well written; they check what
# somebody guessed. These six are not about guessing, they are about
# size, and no volume of tests on 72 campsites can reach any of them.
#
# ci.yml cannot host this, because everything ci.yml does is built around
# a fixture it seeds in a service container. This needs the opposite: the
# real database, the real OSM extracts, and no fixture anywhere near it.
#
# docs/scale-check.md has the decision, what each stage costs, and which
# of the six defects each stage provably catches.

on:
  # 🔴 Nightly, not per PR, and the reason is a measurement rather than a
  # preference. The build this needs is 65 435 pages — six minutes against
  # a warm API, and over seven hours projected the day the rate-limit
  # bypass was misconfigured. Multiplied by every push on every branch
  # that is not a cost this project can carry, and almost every push does
  # not change what the numbers below would say.
  #
  # 02:00 UTC: after the day's work, before the 04:00 weekly import, so a
  # nightly is never reading a database mid-import.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      with-pages:
        description: 'Also build the site and run the browser stage (~12 min)'
        type: boolean
        default: true
  # 🔴 And on demand for a PR that touches the things this can see.
  #
  # A label rather than a path filter. Paths would run this on every
  # commit to those files, which is the per-PR cost again under another
  # name; a label is a person deciding that this change is one of the ones
  # worth the runner. The four paths worth labelling are named in
  # docs/scale-check.md.
  pull_request:
    types: [labeled, synchronize]

# One at a time. Two runs would build into the same .next and read the
# same database, and the second would report on a tree the first is still
# writing — the shape of failure the OSM loader already learned the hard
# way with its own lock.
concurrency:
  group: scale-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scale:
    # 🔴 Skipped unless the label says so, on a pull request.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'scale')

    # 🔴 Self-hosted, and that IS the decision this card had to make.
    #
    # Three ways to get 61 557 campsites in front of a check, priced:
    #
    #  a) a dump in CI. The database is 4 379 MB and the OSM extracts are
    #     30 GB, of which the merged water layer alone is 797 MB — and the
    #     tag census needs that file, not a sample of it. A hosted runner
    #     would spend longer restoring than checking, on every run.
    #  b) a second machine with its own copy of the database. A production
    #     dataset kept in step with production by hand is a dataset that
    #     drifts, and a scale check against a stale copy is worse than
    #     none: it reports on data nobody serves.
    #  c) the machine that already has it, which is where the API, the
    #     database and the extracts live today.
    #
    # (c). The cost of (c) is that this workflow cannot run on a fork and
    # cannot run when that machine is off — so its absence is watched:
    # scripts/ci/check-schedule.mjs lists it, and the daily watchdog opens
    # an issue when a night goes by without a successful run. A nightly
    # that stops, stops silently; that is this repository's own lesson and
    # it applies to the thing it just built.
    runs-on: [self-hosted, camptribe-data]
    timeout-minutes: 45

    env:
      # Where the full-scale API is. A repository variable, so the
      # machine can move without a commit. Never a fixture — the runner
      # refuses below if what answers holds fewer than 10 000 campsites.
      API_BASE_URL: ${{ vars.SCALE_API_URL || 'http://localhost:3001' }}
      # 🔴 A GitHub Secret, by name. The repository is public: no token,
      # no .env and no connection string may ever appear in this file, in
      # a log line, or in a commit.
      API_BUILD_TOKEN: ${{ secrets.SCALE_API_BUILD_TOKEN }}
      # Where the OSM extracts live on that machine — the tag census
      # reads them and cannot be given a smaller stand-in.
      WORK_DIR: ${{ vars.SCALE_OSM_WORK_DIR }}

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      # 🔴 Rehearsed FIRST, before anything is believed.
      #
      # Every guard in this repository is run in two steps and this one is
      # no different: prove it can still fail, then believe the run that
      # says the tree is clean. The rehearsal here is stronger than most —
      # it runs the actual broken versions (the export with its tag
      # allowlist removed, the deleted whole-world snapshot) against the
      # live data, and fails if either goes quiet.
      #
      # It also checks the mirror: the same broken code over three
      # countries, and over the two the fixture is drawn from, must PASS.
      # If it ever stops passing there, these defects were not scale-only
      # and this whole workflow needs rethinking rather than running.
      - name: The scale checks can still fail
        run: ./scripts/scale-check/run.sh --rehearse

      - name: The probes, against the live dataset
        run: ./scripts/scale-check/run.sh

      # ── the browser stage ────────────────────────────────────────────
      #
      # Everything above is seconds. This is the part that costs, so it is
      # skippable on a manual run and the numbers are in the docs.

      - name: Install Chromium
        if: github.event_name != 'workflow_dispatch' || inputs.with-pages
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # 🔴 A production build, because a dev server is not the subject.
      #
      # React StrictMode mounts twice under `next dev` and the CSP forbids
      # the eval the dev compiler needs — measured on this project, in
      # `next dev` not one client script ran at all. Numbers taken there
      # would be about the dev server.
      - name: Build the site from the full database
        if: github.event_name != 'workflow_dispatch' || inputs.with-pages
        env:
          NEXT_PUBLIC_SITE_MODE: closed
        run: npm run build --workspace=apps/web

      - name: The map and the search, in a browser, at full scale
        if: github.event_name != 'workflow_dispatch' || inputs.with-pages
        run: ./scripts/scale-check/run.sh --with-pages

      # 🔴 `always()`, and that is the point of the step: `retries: 1`
      # means a test that fails then passes leaves the job green, so the
      # flake check has to run on a green job too.
      - name: No test passed only on a retry
        if: always()
        run: node scripts/ci/check-flaky.mjs apps/web/playwright-report/report.json

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: scale-report
          path: apps/web/playwright-report/
          retention-days: 7
