name: Backup restore

# CAMP-58: prove nightly that the backup can be restored.
#
# 🔴 The card's bar, in its own words: "a real restore has happened at
# least once — a backup you have not restored from is an assumption, not
# a backup". Once is the floor. A restore that worked in September and
# has not been tried since is the same assumption with a date on it, so
# this runs every night.
#
# 🔴 What this job simulates, and why it is not "restore into an empty
# database". backup-local.sh deliberately does NOT dump everything: most
# of the database is a copy of OpenStreetMap that Geofabrik still has and
# the weekly job rebuilds. What it saves is the part with no source to
# rebuild from — the computed surroundings, the owner corrections, the
# reviews, when a site was first and last seen.
#
# So the disaster being rehearsed is not "the server is gone". It is
# "the database was rebuilt from OSM and everything we computed is
# missing" — which is the likely one, and the one where the restore path
# is a merge rather than a load. The steps below destroy exactly that,
# check that it is really destroyed, and then bring it back.

on:
  schedule:
    # 03:00 UTC. After the nightly window most things use, and five hours
    # before the watchdog at 08:00 looks to see whether this ran.
    - cron: '0 3 * * *'
  workflow_dispatch:
  # 🔴 Also on any change to the backup code itself. A restore path that
  # is only exercised at 03:00 is a restore path whose breakage is found
  # by the alert rather than by the pull request that broke it.
  pull_request:
    paths:
      - 'scripts/backup/**'
      - 'scripts/osm-pipeline/backup-local.sh'
      - '.github/workflows/backup-verify.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/backup/**'
      - 'scripts/osm-pipeline/backup-local.sh'
      - '.github/workflows/backup-verify.yml'

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: camptribe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/camptribe_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The gate's own logic, before it is trusted to judge anything.
      # A checker that ships broken reports "fine" by never disagreeing.
      - name: Prove the checker works
        run: node scripts/backup/check-restore.mjs --self-test

      - name: Schema
        working-directory: apps/api
        run: npx typeorm-ts-node-commonjs migration:run -d src/data-source.ts

      - name: Seed
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f apps/api/test/fixtures/ci-seed.sql

      # 🔴 One row in each content table, so the rehearsal is not vacuous.
      #
      # The fixture holds none of these, and the gate happily compared
      # 0 against a manifest that said 0 and printed a tick beside all
      # four. Review proved what that hid: reviews, photo submissions,
      # guides and routes were backed up every night and had NO restore
      # path at all — a real review was saved, destroyed, and still gone
      # after a "successful" restore.
      #
      # Inserted here rather than in ci-seed.sql on purpose: that fixture
      # also feeds the site build, the sitemap checks and the visual
      # baselines, and a guide added there would become a page. This job
      # is the only one that needs these rows.
      - name: Give the content tables something to lose
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO reviews (camping_spot_id, rating, body, status)
            SELECT id, 4, 'Quiet, and the showers were hot.', 'approved'
              FROM camping_spots LIMIT 1;

            INSERT INTO photo_submissions
                   (camping_spot_id, storage_key, source, shot_on, status)
            SELECT id, 'backup-rehearsal/one.jpg', 'community', DATE '2026-09-01', 'pending'
              FROM camping_spots LIMIT 1;

            -- CHK_guides_provenance_is_accountable: anything not written
            -- by a human must name the thing that generated it. A guide
            -- with no accountable author is exactly what that constraint
            -- exists to refuse, and the rehearsal row is no exception.
            INSERT INTO guides (slug, category, status, provenance, generator)
            VALUES ('backup-rehearsal', 'data', 'draft', 'data-generated',
                    'backup-verify.yml');

            INSERT INTO routes (name, slug, country, duration_days)
            VALUES ('Backup rehearsal route', 'backup-rehearsal', 'si', 3);

            -- 🔴 The children, because they are the actual content: a
            -- guide's text and a route's line. Both were missing from the
            -- backup until this job tripped over the foreign key.
            INSERT INTO guide_translations (guide_id, language_code, title, body)
            SELECT id, 'en', 'Backup rehearsal', 'Text that must survive a restore.'
              FROM guides WHERE slug = 'backup-rehearsal';

            INSERT INTO route_points (route_id, sequence, name, location)
            SELECT id, 1, 'Start',
                   ST_SetSRID(ST_MakePoint(14.09, 46.36), 4326)
              FROM routes WHERE slug = 'backup-rehearsal';"
          # 🔴 Assert, do not merely print. Two of these are
          # `INSERT … SELECT … FROM camping_spots LIMIT 1`, which inserts
          # NOTHING and succeeds when the fixture has no spots — and then
          # the whole rehearsal runs against empty tables and proves the
          # same nothing it was written to stop proving.
          for t in reviews photo_submissions guides guide_translations routes route_points; do
            N=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM $t")
            echo "$t: $N"
            if [ "$N" -lt 1 ]; then
              echo "::error::$t is still empty — the rehearsal would prove nothing about it" >&2
              exit 1
            fi
          done

      # 🔴 Establish what there is to lose, before losing it. If the
      # fixture ever stops carrying computed context, every step below
      # would still pass while proving nothing — so the number is read
      # here and asserted to be real.
      - name: What the fixture holds
        id: before
        run: |
          set -euo pipefail
          N=$(psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM camping_spots WHERE context <> '{}'::jsonb")
          echo "spots with context: $N"
          if [ "$N" -lt 10 ]; then
            echo "::error::the fixture has only $N spots with context — this job would prove nothing" >&2
            exit 1
          fi
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Back up
        run: ./scripts/osm-pipeline/backup-local.sh backup "$RUNNER_TEMP/backup"

      # 🔴 The disaster. Not a dropped database — the realistic one: the
      # spots are still there, rebuilt from OSM, and everything we
      # computed about them is gone.
      - name: Destroy the irreplaceable half
        run: |
          set -euo pipefail
          # 🔴 Every column the backup calls irreplaceable, not just the
          # one that is easy. Review counted it: of six backed-up columns
          # and four tables, exactly one column was being destroyed and
          # demonstrably brought back.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            UPDATE camping_spots
               SET context = '{}'::jsonb,
                   context_computed_at = NULL,
                   owner_overrides = '{}'::jsonb,
                   missing_since = NULL,
                   content_changed_at = NULL;
            TRUNCATE reviews, photo_submissions,
                     guide_translations, guides,
                     route_points, routes,
                     legal_page_translations, legal_pages;"
          LEFT=$(psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM camping_spots WHERE context <> '{}'::jsonb")
          # If this is not zero the restore below would be comparing the
          # database to itself, which is how a restore test passes
          # without restoring anything.
          if [ "$LEFT" != "0" ]; then
            echo "::error::$LEFT spots still have context — the disaster did not happen" >&2
            exit 1
          fi
          echo "context wiped from every spot"

      - name: Restore
        id: restore
        run: |
          set -euo pipefail
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          ./scripts/osm-pipeline/backup-local.sh restore "$RUNNER_TEMP/backup"

      - name: Does it hold up?
        run: |
          # 🔴 --expect-context, not just the manifest. The manifest's
          # single number for camping_spots is an OR across three
          # conditions, and one of them (missing_since) is set by the
          # restore with no guard — so it can be satisfied with zero
          # computed context. The caller knows the real number; it passes it.
          node scripts/backup/check-restore.mjs \
            --manifest "$RUNNER_TEMP/backup/manifest.json" \
            --expect-context "${{ steps.before.outputs.n }}" \
            --started "${{ steps.restore.outputs.started }}" \
            --budget 300

      # 🔴 And the content tables too — the ones that had no restore path
      # at all until this job went looking.
      - name: The content tables are back
        run: |
          set -euo pipefail
          # 🔴 The children too. A guide whose translations did not come
          # back is an empty page that counts as a restored row.
          for t in reviews photo_submissions guides guide_translations routes route_points; do
            N=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM $t")
            echo "$t: $N"
            if [ "$N" -lt 1 ]; then
              echo "::error::$t is empty after the restore — it was backed up and not restored" >&2
              exit 1
            fi
          done

      # 🔴 And the number has to be back, stated separately from the
      # checker so a bug in the checker cannot hide it.
      - name: The computed context is back
        run: |
          set -euo pipefail
          N=$(psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM camping_spots WHERE context <> '{}'::jsonb")
          echo "spots with context after restore: $N (was ${{ steps.before.outputs.n }})"
          if [ "$N" != "${{ steps.before.outputs.n }}" ]; then
            echo "::error::restored $N spots, had ${{ steps.before.outputs.n }} before the wipe" >&2
            exit 1
          fi

  # 🔴 A failing nightly job that nobody is told about is a job that is
  # not running. The same shape as the watchdog: one issue, updated,
  # closed when it recovers.
  alert:
    needs: restore
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # 🔴 GH_REPO, because this job does not check the repository out.
      #
      # `gh` resolves the repository from the git remote, not from
      # GITHUB_REPOSITORY, so without either a checkout or this variable
      # every call fails with "not a git repository" — and the alarm that
      # was supposed to tell somebody the backups are unverified says
      # nothing at all. Demonstrated by review with the full Actions
      # environment set.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='🔴 The backup could not be restored'
          BODY="The nightly restore rehearsal failed: $RUN_URL

          This is the one safeguard every other safeguard assumes. Until it
          passes, treat the backups as unverified — not as broken, but as
          untested, which for a backup is the same thing.

          What the job does: seeds a database, backs it up, destroys the
          computed context and owner corrections, restores, and checks the
          rows came back and that PostGIS still answers on them."
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            # 🔴 No --label. The repository has no `ci` label, and
            # `gh issue create` aborts on one it cannot resolve — so the
            # branch that runs on the FIRST failure, when there is no
            # issue to comment on, is the branch that would fail.
            # Verified: repos/camp-tribe-eu/camp/labels/ci is a 404.
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  # 🔴 And close it when the rehearsal passes again.
  #
  # The comment on the alert job promised "one issue, updated, closed when
  # it recovers" and there was no close step — the exact behaviour
  # watchdog.yml warns "teaches everyone to ignore it".
  recovered:
    needs: restore
    if: success() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE='🔴 The backup could not be restored'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --comment "The nightly restore rehearsal passed again. Closing."
          fi
