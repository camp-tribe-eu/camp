name: OSM weekly extract

# CAMP-28 + CAMP-103: rebuild the campsite extract once a week, and keep it.
#
# OSM is alive — the community adds and corrects campsites daily. Without a
# schedule our map is half a year stale by summer, and the one thing we do
# have over the competition is data that is not wrong.
#
# 🔴 Why the heavy work is here and the import is not:
#
# Downloading a 300 MB extract, filtering it with osmium and converting it
# costs minutes of CPU. On a public repository those minutes are free, so
# they belong here. The *import* does not: it needs the production
# database, and giving a third-party runner a route into our database would
# mean opening it to the internet for the sake of a cron job. The runner
# produces a file; the machine holding the database pulls that file and
# imports it locally.
#
# 🔴 CAMP-103 changed two things about that, both measured on 23.09.2026.
#
# 1. The output used to be an artifact with `retention-days: 14`. Nothing
#    imported it, so every run's work evaporated a fortnight later and the
#    project accumulated nothing. It is now a GitHub Release asset: free on
#    a public repository, no expiry, and reachable by URL from any machine
#    without a token. The R2 step below still runs when its secrets appear
#    (CAMP-97), but we no longer lose data while waiting for it.
#
# 2. The countries used to be `europe/slovenia europe/croatia`, and the
#    whole list ran in one job. Adding the market order to one job would
#    have meant 16 GB of downloads sequentially inside one 90-minute
#    timeout, with France's failure losing Croatia's work. It is a matrix:
#    each country is its own job, they run at once, and `fail-fast: false`
#    means one country's bad day costs that country only.
#
# Repo is public. Never print user data, emails or secrets — the logs are
# readable by any logged-in GitHub account.

on:
  schedule:
    # 04:00 UTC every Monday. Geofabrik publishes daily extracts overnight,
    # and nobody is looking at the site at 6am on a Monday.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      regions:
        description: 'Space-separated Geofabrik paths; empty means the full list'
        required: false
        default: ''

# Least privilege by default; the publish job raises it for itself.
permissions:
  contents: read

env:
  # 🔴 THE LIST IS THE EU-27, AND THAT IS NOW A RULE RATHER THAN A HABIT.
  #
  # A country missing here does NOT get its campsites marked gone — the
  # gone rule is scoped per country and only runs when someone imports
  # that country — which is precisely why it is easy to miss: a country's
  # data would simply stop being refreshed while the others kept
  # updating, so closures and new sites never arrive and nothing anywhere
  # looks wrong.
  #
  # 🔴 Two things were wrong with the previous list, both found 24.09.2026.
  #
  # It held nine countries, and one of them — SWITZERLAND — is not in the
  # European Union. The owner's decision that day was explicit: "поки вони
  # не потрібні, ми про ЄС будуємо зараз" (CAMP-118). Every source this
  # project depends on for safety data is an EU instrument: MeteoAlarm,
  # Copernicus, the national access points of the ITS Directive. A country
  # outside the Union gets campsite pages with no warnings behind them,
  # and a silent hazard layer is worse than an absent one.
  #
  # And it held nine of twenty-seven. The goal is every campsite in the
  # Union, so the list is every member state. Sizes measured from
  # Geofabrik's own Content-Range headers on 24.09.2026, ~25 GB in total
  # and never on one runner at one time — this is a matrix, one country
  # per job, `fail-fast: false`, so one country's bad day costs that
  # country only.
  #
  # ⚠️ `ireland-and-northern-ireland` is Geofabrik's only Irish extract
  # and it includes part of the United Kingdom. That is the shape of the
  # source, not a decision to leave the EU behind: the country filter at
  # import time is what keeps non-EU rows out (CAMP-118).
  #
  # ⚠️ "27" is the Union as of 2026, not a constant of the universe. The
  # day it changes, this list and the filter change together.
  DEFAULT_REGIONS: >-
    europe/austria
    europe/belgium
    europe/bulgaria
    europe/croatia
    europe/cyprus
    europe/czech-republic
    europe/denmark
    europe/estonia
    europe/finland
    europe/france
    europe/germany
    europe/greece
    europe/hungary
    europe/ireland-and-northern-ireland
    europe/italy
    europe/latvia
    europe/lithuania
    europe/luxembourg
    europe/malta
    europe/netherlands
    europe/poland
    europe/portugal
    europe/romania
    europe/slovakia
    europe/slovenia
    europe/spain
    europe/sweden

jobs:
  # Turn the region list into a matrix. It is its own job because a
  # matrix has to be JSON before the jobs it drives are created.
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.plan.outputs.regions }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - id: plan
        # 🔴 The input arrives through env, not through ${{ }} inside the
        # script. Interpolating a workflow input straight into a shell
        # body is the standard Actions script-injection hole: the value
        # is pasted before bash sees it, so a crafted input runs as our
        # workflow. Through env it is data that bash quotes.
        env:
          REQUESTED: ${{ inputs.regions }}
        run: |
          set -euo pipefail
          # An array, not a bare variable: the split is deliberate here,
          # and saying so in the code beats silencing the linter that
          # correctly points at an unquoted expansion.
          #
          # Newlines are flattened first because `read` stops at the
          # first one. DEFAULT_REGIONS is a folded YAML scalar today, so
          # it arrives as one line — but a later edit to `|-` would
          # otherwise silently build Slovenia and nothing else.
          read -r -a REGIONS <<< "$(printf '%s' "${REQUESTED:-$DEFAULT_REGIONS}" | tr '\n' ' ')"

          if [ "${#REGIONS[@]}" -eq 0 ]; then
            echo "::error::no regions to build"
            exit 1
          fi

          # Only Geofabrik-shaped paths. This is both a typo guard and
          # the second half of the injection defence: whatever arrives,
          # what reaches a URL is [a-z-]/[a-z-].
          for R in "${REGIONS[@]}"; do
            if ! grep -Eq '^[a-z-]+/[a-z-]+$' <<<"$R"; then
              echo "::error::'$R' is not a Geofabrik path like europe/croatia"
              exit 1
            fi
          done

          JSON=$(printf '%s\n' "${REGIONS[@]}" | jq -R . | jq -sc .)
          echo "regions=$JSON" >> "$GITHUB_OUTPUT"
          echo "count=${#REGIONS[@]}" >> "$GITHUB_OUTPUT"
          echo "planned: ${REGIONS[*]}"

  extract:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # 🔴 One country's bad day must not cost the others. Geofabrik
      # occasionally serves a partial file, and with fail-fast the whole
      # week's work would go with it.
      fail-fast: false
      # The runner allowance is generous on public repos, but flooding
      # Geofabrik with nine parallel downloads is rude and gets us
      # rate-limited. Four at a time is plenty: the wall clock is the
      # slowest country, not the sum.
      max-parallel: 4
      matrix:
        region: ${{ fromJson(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v7
      # 🔴 The extract now runs normalise-export.mjs, so this job needs a
      # Node — and node-version-file rather than a literal, because it
      # cannot drift from .nvmrc (CAMP-178).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install osmium and GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool gdal-bin
          osmium --version | head -1

      - name: Download, filter and convert
        id: build
        env:
          REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          SLUG="$(echo "$REGION" | tr '/' '-')"
          mkdir -p out

          # 🔴 ONE script, shared with scripts/osm-pipeline/load-context.sh.
          #
          # This step used to follow `<region>-latest.osm.pbf` and insist
          # the redirect landed on a dated file. The insisting is right —
          # an md5 proves the bytes, never WHICH file they are. What was
          # wrong is that -latest does not always land on a dated file:
          # Geofabrik balances its largest extracts onto mirrors, and a
          # mirror serves only `-latest`. The weekly import died on
          # Germany and stayed dead 13 days.
          #
          # load-context.sh hit the SAME wall on 25.09.2026 and fixed it
          # the opposite way — by accepting `-latest`. Two copies of one
          # rule, repaired in opposite directions, neither aware of the
          # other. See geofabrik-url.sh for what that cost.
          # Підстановка, а не process substitution: під `set -e` падіння
          # скрипта має зупинити крок тут, а не перетворитись на порожній
          # `read`, який ще треба вгадати.
          RESOLVED=$(scripts/osm-pipeline/geofabrik-url.sh "$REGION")
          read -r URL YMD AGE <<< "$RESOLVED"
          echo "  $REGION: $YMD (D-$AGE)"

          # 🔴 The checksum, which this step did not have.
          #
          # The only gate here was "is it at least 100 000 bytes", and
          # that is exactly the gate load-context.sh was reviewed for
          # having: a truncated or spliced file of the right length walks
          # straight through it. This job then publishes the result as a
          # release asset the API imports, so a wrong extract does not
          # stop at this runner — it becomes our data.
          #
          # -f so a 404 page cannot be read as a checksum, and the hex
          # shape asserted so an error body cannot be one either.
          EXPECT=$(curl -fsSL --retry 3 --retry-delay 10 --max-time 60 "$URL.md5" \
                     | awk '{print $1}') || EXPECT=''
          if ! grep -qE '^[0-9a-f]{32}$' <<<"$EXPECT"; then
            echo "::error::no usable .md5 for $REGION — refusing to trust the download"
            exit 1
          fi

          curl -sSL --retry 3 --retry-delay 10 -o "$SLUG.osm.pbf" "$URL"

          GOT=$(md5sum "$SLUG.osm.pbf" | awk '{print $1}')
          if [ "$GOT" != "$EXPECT" ]; then
            echo "::error::$REGION checksum $GOT, expected $EXPECT — not loading it"
            exit 1
          fi
          echo "  $REGION: $(stat -c%s "$SLUG.osm.pbf") bytes, checksum ok"

          # 🔴 ONE script, shared with scripts/osm-pipeline/import.sh.
          #
          # This step used to carry its own copy of the filter and the
          # export, and the copy is what ships: this workflow builds the
          # published data release, while import.sh is what somebody runs
          # by hand. So when CAMP-253 fixed the duplicate-and-stray-node
          # bug in import.sh, it fixed the half that does not ship —
          # review reproduced the untouched path here on Austria and got
          # exactly the state the fix claimed to have removed: 1 493
          # features, 116 gates and flagpoles, 603 duplicate copies.
          #
          # Two copies of a rule is one rule and one decoration, and
          # nothing in either file says which is which.
          scripts/osm-pipeline/extract-campsites.sh \
            "$SLUG.osm.pbf" "out/$SLUG.geojson"

          # France is 4.9 GB and the runner has about 14 GB free. Nothing
          # downstream needs the PBF, so it goes before anything else can
          # run out of room.
          rm -f "$SLUG.osm.pbf" "$SLUG.filtered.osm.pbf"

          COUNT=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['features']))" "out/$SLUG.geojson")
          echo "$REGION: $COUNT features"

          # 🔴 Zero is never right for a European country and almost
          # always means the filter or the download broke. Failing here
          # keeps a file that would blank a country out of the release.
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::$REGION produced 0 campsites — refusing to publish it"
            exit 1
          fi

          gzip -9 "out/$SLUG.geojson"
          # The publish job sums these rather than decompressing nine
          # files to count what this job already knows.
          # 🔴 The extract's OWN date, not the build date. Review found
          # the release claiming "built from Geofabrik's daily exports on
          # <today>" while the file could be up to a week older, and the
          # real date existed nowhere but one line of job log.
          echo "$REGION $COUNT $YMD" > "out/$SLUG.count"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          ls -lh out/

      - name: Hand the file to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: extract-${{ steps.build.outputs.slug }}
          path: out/
          # Short on purpose: this is a courier between two jobs of the
          # same run, not storage. Storage is the release below.
          retention-days: 1

  publish:
    needs: [plan, extract]
    # `always()` so a release still happens when one country failed —
    # eight countries of fresh data beat none. The completeness check
    # below is what makes the gap loud instead of silent.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      # v7, not v8. One version behind on purpose — the same rule we
      # gave Dependabot in its cooldown: let a major release be looked at
      # by other people for a fortnight first. Dependabot will offer v8
      # when its own cooldown expires.
      - uses: actions/download-artifact@v8
        with:
          pattern: extract-*
          merge-multiple: true
          path: out

      - name: Check what arrived
        id: check
        env:
          PLANNED: ${{ needs.plan.outputs.count }}
        run: |
          set -euo pipefail
          mkdir -p out
          GOT=$(find out -name '*.geojson.gz' | wc -l | tr -d ' ')
          echo "got=$GOT planned=$PLANNED"

          # Nothing at all means every country failed. There is no
          # release to make and the alert below is the whole output.
          if [ "$GOT" -eq 0 ]; then
            echo "::error::no region produced an extract"
            echo "complete=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOTAL=$(cat out/*.count | awk '{s+=$2} END {print s}')
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "got=$GOT" >> "$GITHUB_OUTPUT"
          if [ "$GOT" -lt "$PLANNED" ]; then
            echo "complete=partial" >> "$GITHUB_OUTPUT"
          else
            echo "complete=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        if: steps.check.outputs.complete != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETE: ${{ steps.check.outputs.complete }}
          TOTAL: ${{ steps.check.outputs.total }}
          GOT: ${{ steps.check.outputs.got }}
          PLANNED: ${{ needs.plan.outputs.count }}
        run: |
          set -euo pipefail
          TAG="osm-$(date -u +%Y-%m-%d)"

          {
            # 🔴 The build date is NOT the data date, and saying so was a
            # lie waiting to happen: a region's extract can be several
            # days older than this run. Each row now carries the date of
            # the file it was actually built from.
            echo "Campsite extract built on $(date -u +%Y-%m-%d) from Geofabrik's OpenStreetMap exports."
            echo "Each region shows the date of the extract it was built from — they are not all the same day."
            echo
            echo "| region | campsites | extract |"
            echo "| --- | --- | --- |"
            sort out/*.count | awk '{printf "| %s | %s | 20%s-%s-%s |\n", $1, $2, substr($3,1,2), substr($3,3,2), substr($3,5,2)}'
            echo
            echo "**$TOTAL campsites across $GOT of $PLANNED regions.**"
            if [ "$COMPLETE" = 'partial' ]; then
              echo
              echo "> ⚠️ Incomplete: $((PLANNED - GOT)) region(s) failed to build."
              echo "> The regions listed above carry the extract date they were"
              echo "> built from; the missing ones keep"
              echo "> whatever an earlier release holds. See the run log."
            fi
            echo
            # 🔴 The command must match what this release actually holds.
            #
            # These notes told the reader to run import.sh on a
            # `<file>.osm.pbf`, and the assets below are `.geojson.gz` —
            # the PBFs never leave the runner. Anyone following the
            # instruction downloads an asset the command cannot open.
            # Instructions that do not run are worse than none: they are
            # believed first and debugged second.
            echo "Import the whole release with:"
            echo '```'
            echo "node scripts/osm-pipeline/import-release.mjs --tag $TAG"
            echo '```'
            echo
            echo "Or one member state at a time:"
            echo '```'
            echo "node scripts/osm-pipeline/import-release.mjs --tag $TAG fr si"
            echo '```'
            echo
            # 🔴 ODbL requires attribution and the licence notice from
            # anyone who redistributes the database — and publishing a
            # release asset is redistribution, not display. See
            # /legal/attribution for the same notice on the site.
            echo '---'
            echo
            echo "Contains information from [OpenStreetMap](https://www.openstreetmap.org/),"
            echo "which is made available under the [Open Database License (ODbL)](https://opendatacommons.org/licenses/odbl/1-0/)."
            echo "© OpenStreetMap contributors. Extracts by [Geofabrik](https://download.geofabrik.de/)."
          } > notes.md

          # A re-run on the same day updates the day's release instead of
          # failing on the existing tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" out/*.geojson.gz out/*.count --clobber
          else
            # 🔴 Pre-release on purpose. These are weekly data snapshots;
            # marking one "Latest release" would put a geojson dump at the
            # top of the repository page as though it were the product.
            gh release create "$TAG" out/*.geojson.gz out/*.count \
              --prerelease \
              --title "OSM campsites — $(date -u +%Y-%m-%d)" \
              --notes-file notes.md
          fi
          echo "published $TAG"

      # ⏸ Blocked on CAMP-97 (Cloudflare payment card / R2 vs VPS decision).
      # 🔴 The secret is tested through env, not read directly in `if`.
      #
      # My previous "fix" here put `secrets.X` straight into the step's
      # `if`, on the belief that `env` did not work there. That was wrong
      # in the worst way: it made the whole workflow file unparseable, so
      # GitHub failed the run in 0s with no jobs on every push for two
      # days — and because the failure is a config error, it produces no
      # log to read. Hence the workflow-lint step in CI.
      - name: Upload to R2
        if: steps.check.outputs.complete != 'none' && env.HAS_R2 == 'true'
        env:
          HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          pip install --quiet awscli
          aws s3 sync out/ "s3://camptribe-osm/$(date -u +%Y-%m-%d)/" \
            --endpoint-url "$R2_ENDPOINT"

      # 🔴 Weekly releases accumulate at 52 a year. Without this the
      # release list becomes unreadable and the useful one — the newest —
      # is buried. Half a year of history is far more than any import
      # needs, and the raw data is always rebuildable from Geofabrik.
      - name: Prune data releases older than the last 26
        if: steps.check.outputs.complete != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The pattern is exact on purpose: only tags this workflow
          # creates can match, so nothing a human tagged is reachable
          # from here even by accident.
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^osm-[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | sort -r \
            | tail -n +27 \
            | while read -r OLD; do
                echo "pruning $OLD"
                gh release delete "$OLD" --yes --cleanup-tag
              done

      - name: Summary
        if: always()
        run: |
          {
            echo "### OSM weekly extract"
            echo ""
            echo "- regions: **${{ steps.check.outputs.got }} of ${{ needs.plan.outputs.count }}**"
            echo "- campsites: **${{ steps.check.outputs.total }}**"
            echo "- release: \`osm-$(date -u +%Y-%m-%d)\` (kept, not expiring)"
          } >> "$GITHUB_STEP_SUMMARY"

  # 🔴 A scheduled run that fails at 04:00 on a Monday fails to nobody.
  #
  # GitHub emails the person who last touched the workflow file, which is
  # whoever happened to edit it — not necessarily anyone watching. And a
  # weekly job can be broken for a month before the symptom (stale map
  # data, campsites wrongly counted as missing) becomes visible on the
  # site. So a failure opens an issue, which is loud, free and needs no
  # third-party service.
  #
  # It updates the open issue instead of filing a new one each week: a
  # watchdog that produces four identical issues a month gets muted, and
  # a muted watchdog is worse than none.
  #
  # 🔴 This cannot catch the workflow not running at all — a job with
  # `if: failure()` needs a run to fail. That is what watchdog.yml is for.
  alert:
    needs: [plan, extract, publish]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # 🔴 GH_REPO, because this job does not check the repository out.
      #
      # `gh` resolves the repository from the git remote, not from
      # GITHUB_REPOSITORY. Without either a checkout or this variable
      # every call dies with "not a git repository" — and the alarm about
      # a broken extract says nothing at all.
      #
      # This is not a hypothetical. The job's `if:` only fires on a
      # failure, every earlier run of this workflow was green, so it had
      # never run once. On 19.10.2026 at 04:37 UTC it ran for the first
      # time (run 39199081913, 23 of 27 regions timed out on Geofabrik)
      # and died on its first `gh` call. backup-verify.yml:265 had
      # carried the fix and the explanation since CAMP-58; this file was
      # written without it (CAMP-347).
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='🔴 Weekly OSM extract is failing'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          BODY="The scheduled OSM extract failed, in whole or for some regions.

          Run: $RUN_URL

          While this is broken the campsite data simply stops being
          refreshed: closures, new sites and tag changes never arrive, and
          nothing on the site looks wrong. That is why it needs an alert
          rather than a symptom.

          A partial failure still publishes a release for the regions that
          worked — check the run log for which region failed and why."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            # 🔴 No --label. This repository has no `ci` label and
            # `gh issue create` aborts on one it cannot resolve, so the
            # branch that runs on the FIRST failure — when there is no
            # issue to comment on — is exactly the branch that would
            # fail. Measured 19.10.2026: `gh label list` returns 14
            # labels and `ci` is not among them. backup-verify.yml:294
            # says the same thing; this file did not.
            gh issue create --title "$TITLE" --body "$BODY"
          fi
