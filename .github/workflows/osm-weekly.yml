name: OSM weekly extract

# CAMP-28 + CAMP-103: rebuild the campsite extract once a week, and keep it.
#
# OSM is alive — the community adds and corrects campsites daily. Without a
# schedule our map is half a year stale by summer, and the one thing we do
# have over the competition is data that is not wrong.
#
# 🔴 Why the heavy work is here and the import is not:
#
# Downloading a 300 MB extract, filtering it with osmium and converting it
# costs minutes of CPU. On a public repository those minutes are free, so
# they belong here. The *import* does not: it needs the production
# database, and giving a third-party runner a route into our database would
# mean opening it to the internet for the sake of a cron job. The runner
# produces a file; the machine holding the database pulls that file and
# imports it locally.
#
# 🔴 CAMP-103 changed two things about that, both measured on 23.09.2026.
#
# 1. The output used to be an artifact with `retention-days: 14`. Nothing
#    imported it, so every run's work evaporated a fortnight later and the
#    project accumulated nothing. It is now a GitHub Release asset: free on
#    a public repository, no expiry, and reachable by URL from any machine
#    without a token. The R2 step below still runs when its secrets appear
#    (CAMP-97), but we no longer lose data while waiting for it.
#
# 2. The countries used to be `europe/slovenia europe/croatia`, and the
#    whole list ran in one job. Adding the market order to one job would
#    have meant 16 GB of downloads sequentially inside one 90-minute
#    timeout, with France's failure losing Croatia's work. It is a matrix:
#    each country is its own job, they run at once, and `fail-fast: false`
#    means one country's bad day costs that country only.
#
# 🔴 CAMP-113 (decision of 28.10.2026): THE SAME JOB CUTS A SECOND LAYER.
#
# `osm_route_poi` — fuel, charging, water, dump stations, rest areas, shops,
# food and lodging between campsites — was refreshed by hand with
# load-route-poi.sh on a machine holding all 27 extracts, and went 14+ days
# stale. The extract job here already downloads every member state's PBF
# (25 GB a week, the expensive part); after the campsites are cut and
# handed over, `extract-route-poi.sh` cuts the route POI from the SAME file
# and the result travels in the SAME release as `<region>.rpoi.geojson.gz`
# + `<region>.rpoi.count`. On the machine, `import-route-poi.mjs`
# (camptribe-route-poi-import.timer, Tuesday 05:30 UTC) pulls them with the
# same age limit the campsite import has. Two layers, one download, one
# release, one chain. The route-POI step runs AFTER the campsite artifact is
# uploaded, so its failure costs the route POI of that country and never
# the campsites; the job still goes red, which is what the alert reads.
#
# 🔴 COST, because the repository is about to become private (2 000
# Actions minutes a month). Measured on the 26.10.2026 run: the 27 campsite
# jobs took 85.6 wall minutes, 102 billable (each job rounds up); Germany's
# 4.9 GB download alone was 12.5 of its 21 minutes, the osmium pass 2.1.
# The route-POI pass over the same PBF costs about 1.7× the campsite pass
# (Germany, locally: 40 s against 65 s), i.e. a few minutes on the largest
# countries and seconds on most — see the card for the measured total.
#
# Repo is public. Never print user data, emails or secrets — the logs are
# readable by any logged-in GitHub account.

on:
  schedule:
    # 04:00 UTC every Monday. Geofabrik publishes daily extracts overnight,
    # and nobody is looking at the site at 6am on a Monday.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      regions:
        description: 'Space-separated Geofabrik paths; empty means the full list'
        required: false
        default: ''

# Least privilege by default; the publish job raises it for itself.
permissions:
  contents: read

env:
  # 🔴 THE LIST IS THE EU-27, AND THAT IS NOW A RULE RATHER THAN A HABIT.
  #
  # A country missing here does NOT get its campsites marked gone — the
  # gone rule is scoped per country and only runs when someone imports
  # that country — which is precisely why it is easy to miss: a country's
  # data would simply stop being refreshed while the others kept
  # updating, so closures and new sites never arrive and nothing anywhere
  # looks wrong.
  #
  # 🔴 Two things were wrong with the previous list, both found 24.09.2026.
  #
  # It held nine countries, and one of them — SWITZERLAND — is not in the
  # European Union. The owner's decision that day was explicit: "поки вони
  # не потрібні, ми про ЄС будуємо зараз" (CAMP-118). Every source this
  # project depends on for safety data is an EU instrument: MeteoAlarm,
  # Copernicus, the national access points of the ITS Directive. A country
  # outside the Union gets campsite pages with no warnings behind them,
  # and a silent hazard layer is worse than an absent one.
  #
  # And it held nine of twenty-seven. The goal is every campsite in the
  # Union, so the list is every member state. Sizes measured from
  # Geofabrik's own Content-Range headers on 24.09.2026, ~25 GB in total
  # and never on one runner at one time — this is a matrix, one country
  # per job, `fail-fast: false`, so one country's bad day costs that
  # country only.
  #
  # ⚠️ `ireland-and-northern-ireland` is Geofabrik's only Irish extract
  # and it includes part of the United Kingdom. That is the shape of the
  # source, not a decision to leave the EU behind: the country filter at
  # import time is what keeps non-EU rows out (CAMP-118).
  #
  # ⚠️ "27" is the Union as of 2026, not a constant of the universe. The
  # day it changes, this list and the filter change together.
  DEFAULT_REGIONS: >-
    europe/austria
    europe/belgium
    europe/bulgaria
    europe/croatia
    europe/cyprus
    europe/czech-republic
    europe/denmark
    europe/estonia
    europe/finland
    europe/france
    europe/germany
    europe/greece
    europe/hungary
    europe/ireland-and-northern-ireland
    europe/italy
    europe/latvia
    europe/lithuania
    europe/luxembourg
    europe/malta
    europe/netherlands
    europe/poland
    europe/portugal
    europe/romania
    europe/slovakia
    europe/slovenia
    europe/spain
    europe/sweden

jobs:
  # Turn the region list into a matrix. It is its own job because a
  # matrix has to be JSON before the jobs it drives are created.
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.plan.outputs.regions }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - id: plan
        # 🔴 The input arrives through env, not through ${{ }} inside the
        # script. Interpolating a workflow input straight into a shell
        # body is the standard Actions script-injection hole: the value
        # is pasted before bash sees it, so a crafted input runs as our
        # workflow. Through env it is data that bash quotes.
        env:
          REQUESTED: ${{ inputs.regions }}
        run: |
          set -euo pipefail
          # An array, not a bare variable: the split is deliberate here,
          # and saying so in the code beats silencing the linter that
          # correctly points at an unquoted expansion.
          #
          # Newlines are flattened first because `read` stops at the
          # first one. DEFAULT_REGIONS is a folded YAML scalar today, so
          # it arrives as one line — but a later edit to `|-` would
          # otherwise silently build Slovenia and nothing else.
          read -r -a REGIONS <<< "$(printf '%s' "${REQUESTED:-$DEFAULT_REGIONS}" | tr '\n' ' ')"

          if [ "${#REGIONS[@]}" -eq 0 ]; then
            echo "::error::no regions to build"
            exit 1
          fi

          # Only Geofabrik-shaped paths. This is both a typo guard and
          # the second half of the injection defence: whatever arrives,
          # what reaches a URL is [a-z-]/[a-z-].
          for R in "${REGIONS[@]}"; do
            if ! grep -Eq '^[a-z-]+/[a-z-]+$' <<<"$R"; then
              echo "::error::'$R' is not a Geofabrik path like europe/croatia"
              exit 1
            fi
          done

          JSON=$(printf '%s\n' "${REGIONS[@]}" | jq -R . | jq -sc .)
          echo "regions=$JSON" >> "$GITHUB_OUTPUT"
          echo "count=${#REGIONS[@]}" >> "$GITHUB_OUTPUT"
          echo "planned: ${REGIONS[*]}"

  extract:
    needs: plan
    runs-on: ubuntu-latest
    # 🔴 90, А НЕ 45 — БО 45 БУЛО МЕНШЕ ЗА ВЛАСНИЙ БЮДЖЕТ ЗАВАНТАЖЕННЯ.
    #
    # Заміряно 03.11.2026. Крок завантаження нижче робить **чотири**
    # спроби по `--max-time 1200`, тобто **4 × 20 = 80 хвилин** стелі
    # лише на `curl`. Плюс фільтрація й конвертація.
    #
    # 🔴 Спочатку це було `--retry 3` — і саме ТУТ ховалась одиниця:
    # `--retry 3` це ЧОТИРИ спроби, а не три. Відколи CAMP-434 замінив
    # його на цикл окремих викликів, число живе в `ATTEMPTS=4`, і сторож
    # читає обидві форми — інакше він замовк би на зміні форми команди.
    #
    # Число 80 я спершу порахував як 60 і помилився; виправив його не я,
    # а сторож `check-osm-weekly-guards.mjs`, який рахує бюджет сам:
    # «4800 с (--max-time 1200 × 4 спроб) більший за timeout-minutes 45».
    #
    # При старому таймауті 45 останні дві спроби не могли завершитись у
    # принципі: робота вмирала раніше, ніж політика повтору дограла.
    #
    # Два запобіжники суперечили один одному, і зовнішній мовчки
    # скасовував внутрішній.
    #
    # Що показав прогін того дня (Франція 4,76 ГБ, Німеччина 4,54 ГБ —
    # розмір майже той самий):
    #
    #   germany  success   17 хв   ← швидке дзеркало
    #   france   cancelled 45 хв   ← вбита таймаутом на повільному
    #
    # Geofabrik балансує найбільші екстракти по дзеркалах, і швидкість
    # на них різниться на порядок (заміряно з нашої машини того ж дня:
    # 18 МБ/с проти 1,5 МБ/с). 4,76 ГБ на 1,5 МБ/с — це 53 хвилини лише
    # на завантаження.
    #
    # 🔴 Зависання ловить НЕ цей таймаут, а `--speed-limit 102400
    # --speed-time 300`: падіння нижче 100 КіБ/с на 5 хвилин обриває
    # спробу. Тобто 90 хвилин не дають «висіти вічно» — вони лише
    # перестають різати чесне повільне завантаження.
    timeout-minutes: 90
    strategy:
      # 🔴 One country's bad day must not cost the others. Geofabrik
      # occasionally serves a partial file, and with fail-fast the whole
      # week's work would go with it.
      fail-fast: false
      # The runner allowance is generous on public repos, but flooding
      # Geofabrik with nine parallel downloads is rude and gets us
      # rate-limited. Four at a time is plenty: the wall clock is the
      # slowest country, not the sum.
      max-parallel: 4
      matrix:
        region: ${{ fromJson(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v7
      # 🔴 The extract now runs normalise-export.mjs, so this job needs a
      # Node — and node-version-file rather than a literal, because it
      # cannot drift from .nvmrc (CAMP-178).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install osmium and GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool gdal-bin
          osmium --version | head -1

      - name: Download, filter and convert
        id: build
        env:
          REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          SLUG="$(echo "$REGION" | tr '/' '-')"
          mkdir -p out

          # 🔴 ONE script, shared with scripts/osm-pipeline/load-context.sh.
          #
          # This step used to follow `<region>-latest.osm.pbf` and insist
          # the redirect landed on a dated file. The insisting is right —
          # an md5 proves the bytes, never WHICH file they are. What was
          # wrong is that -latest does not always land on a dated file:
          # Geofabrik balances its largest extracts onto mirrors, and a
          # mirror serves only `-latest`. The weekly import died on
          # Germany and stayed dead 13 days.
          #
          # load-context.sh hit the SAME wall on 25.09.2026 and fixed it
          # the opposite way — by accepting `-latest`. Two copies of one
          # rule, repaired in opposite directions, neither aware of the
          # other. See geofabrik-url.sh for what that cost.
          # Підстановка, а не process substitution: під `set -e` падіння
          # скрипта має зупинити крок тут, а не перетворитись на порожній
          # `read`, який ще треба вгадати.
          RESOLVED=$(scripts/osm-pipeline/geofabrik-url.sh "$REGION")
          read -r URL YMD AGE <<< "$RESOLVED"
          echo "  $REGION: $YMD (D-$AGE)"

          # 🔴 The checksum, which this step did not have.
          #
          # The only gate here was "is it at least 100 000 bytes", and
          # that is exactly the gate load-context.sh was reviewed for
          # having: a truncated or spliced file of the right length walks
          # straight through it. This job then publishes the result as a
          # release asset the API imports, so a wrong extract does not
          # stop at this runner — it becomes our data.
          #
          # -f so a 404 page cannot be read as a checksum, and the hex
          # shape asserted so an error body cannot be one either.
          EXPECT=$(curl -fsSL --retry 3 --retry-delay 10 --max-time 60 "$URL.md5" \
                     | awk '{print $1}') || EXPECT=''
          if ! grep -qE '^[0-9a-f]{32}$' <<<"$EXPECT"; then
            echo "::error::no usable .md5 for $REGION — refusing to trust the download"
            exit 1
          fi

          # 🔴 ЗУПИНКА — НЕ ПОВІЛЬНІСТЬ, І ТІЛЬКИ ВОНА НАС УБИВАЄ.
          #
          # 02.11.2026 Німеччина, Франція та Італія висіли рівно 45:45 і
          # були вбиті `timeout-minutes`. Останній рядок у журналі кожної:
          # `Terminate orphan process: pid (2989) (curl)`. Тобто робота
          # не «не встигла» — зʼєднання стояло. Доказ, що часу вистачає:
          # 26.10 ті самі країни відпрацювали за 21, 12 і 4 хвилини при
          # розмірах 4.54, 4.76 і 2.09 ГБ. Тому ми НЕ піднімаємо
          # `timeout-minutes` — ми не даємо зависнути.
          #
          # Рядком вище `.md5` уже має `--max-time 60`; найбільше
          # завантаження з усіх не мало НІЧОГО.
          #
          # `--retry` саме по собі тут безсиле: він спрацьовує на помилці
          # чи розриві, а зʼєднання, яке відкрите й не несе байтів,
          # помилкою не є. Це робить `--speed-limit/--speed-time`:
          # менше за 100 КіБ/с протягом 5 хв — обрив і нова спроба (часто
          # на інше дзеркало: Німеччина йде через редирект на ftp5.gwdg.de).
          #
          # 🔴 ПОРІГ ОПУЩЕНО З 1 МіБ/с 02.11.2026, І ЦЕ ВИПРАВЛЕННЯ МОЄЇ
          # ЖЕ ПОМИЛКИ. 1 МіБ/с я взяв із найбільшого файлу й застосував
          # до всіх: для Франції на 4.76 ГБ це справді безнадійно, а для
          # Австрії на ~700 МБ — 12 хвилин, тобто цілком у межах 45.
          # Тобто запобіжник міг обірвати завантаження, яке встигло б, —
          # площа ураження сторожа більша за площу дефекту.
          # 100 КіБ/с ловить зупинку так само (4.5 ГБ на такій швидкості
          # це 13 годин), а повільне-але-живе дзеркало переживає.
          #
          # `--max-time 1200` — стеля ОДНІЄЇ спроби, щоб чотири спроби з
          # запасом лишались усередині `timeout-minutes`, а не впирались
          # у нього.
          #
          # 🔴 CAMP-434. ЦИКЛ ОКРЕМИХ ВИКЛИКІВ, А НЕ `--retry`. ЗАМІРЯНО.
          #
          # 03.11.2026 Німеччина впала так: чотири спроби по 20 хвилин,
          # кожна взяла 1,6–3,4 ГБ із 4 874 969 556 і ВИКИНУЛА їх.
          #
          #   timed out after 1200000 ms with 1959690240 out of 4874969556
          #   timed out after 1200000 ms with 3443727895 out of 4874969556
          #   timed out after 1200000 ms with 1639366656 out of 4874969556
          #   timed out after 1200000 ms with 1923526656 out of 4874969556
          #
          # Швидкість раннера до Geofabrik: 1,37–2,87 МБ/с. При 2,87 повний
          # файл потребує ~1700 с ≈ 28 хв, тобто БІЛЬШЕ за стелю спроби —
          # жодна з чотирьох не могла завершитись у принципі.
          #
          # 🔴 І `-C -` разом із `--retry` цього НЕ лагодить. Заміряно на
          # curl 8.7.1, Люксембург 47 876 770 Б, `--max-time 2`:
          #
          #   with 527873 out of 47876770      ← кожна спроба каже
          #   with 589313 out of 47876770         «out of ПОВНИЙ РОЗМІР»,
          #   with 515585 out of 47876770         тобто починає з нуля;
          #   with 1916417 out of 47876770     файл після чотирьох: 1 916 417
          #
          # `-C -` читає наявний файл на ПОЧАТКУ виклику, а не між
          # внутрішніми спробами `--retry`. Накопичують лише ОКРЕМІ виклики:
          # той самий файл трьома викликами дав 4 927 000 → 5 377 560 →
          # 6 032 920.
          #
          # Тому цикл. Бюджет той самий (4 × 20 хв + затримки), але те, що
          # вже отримано, лишається на диску.
          #
          # Три краї, перевірені заміром, а не припущені:
          #  * `-C -` на неіснуючому файлі починає з нуля без помилки;
          #  * на вже ПОВНОМУ файлі виходить з кодом 0 і не псує його
          #    (розмір і md5 збіглись до байта);
          #  * Geofabrik віддає діапазони — після обриву на 568 856 сервер
          #    порахував залишок: `with 2560000 out of 47307914`.
          #
          # Зіпсоване поновлення ловить звірка `.md5` нижче — вона тут і
          # була, і саме вона робить цей цикл безпечним.
          ATTEMPTS=4
          for i in $(seq 1 "$ATTEMPTS"); do
            HAVE=$(stat -c%s "$SLUG.osm.pbf" 2>/dev/null || echo 0)
            echo "  $REGION: спроба $i з $ATTEMPTS, вже маємо $HAVE байт"
            RC=0
            curl -sSL -C - --speed-limit 102400 --speed-time 300 --max-time 1200 \
                 -o "$SLUG.osm.pbf" "$URL" || RC=$?
            if [ "$RC" -eq 0 ]; then break; fi
            echo "  $REGION: curl вийшов з $RC на $(stat -c%s "$SLUG.osm.pbf" 2>/dev/null || echo 0) байтах"
            # `if`, а не `[ … ] && sleep 10`, заради читабельності.
            #
            # 🔴 І це НЕ про безпеку, хоч я так і написав був. Думка була:
            # «хибний тест останньою командою тіла зробить хибним увесь
            # цикл, і `bash -e` уб'є крок». Заміряно підстановкою цього ж
            # блоку зі стабом curl: обидві форми дали той самий вивід і
            # той самий код 1 — `bash -e` не виходить, коли падає ліва
            # частина списку `&&`. Коментар правлю, щоб наступний не
            # повірив у властивість, якої тут немає.
            if [ "$i" -lt "$ATTEMPTS" ]; then sleep 10; fi
          done

          # 🔴 Цикл сам по собі не падає, тож поразку треба назвати ТУТ.
          # Інакше обрізаний файл поїхав би на звірку `.md5` і крок сказав
          # би «checksum не збігся» — правду, але не ту, і наступного разу
          # ми шукали б зіпсоване дзеркало замість повільного каналу.
          if [ "$RC" -ne 0 ]; then
            echo "::error::$REGION: $ATTEMPTS спроб, останній код curl $RC, на диску $(stat -c%s "$SLUG.osm.pbf" 2>/dev/null || echo 0) байт — завантажити не вдалось"
            exit 1
          fi

          GOT=$(md5sum "$SLUG.osm.pbf" | awk '{print $1}')
          if [ "$GOT" != "$EXPECT" ]; then
            echo "::error::$REGION checksum $GOT, expected $EXPECT — not loading it"
            exit 1
          fi
          echo "  $REGION: $(stat -c%s "$SLUG.osm.pbf") bytes, checksum ok"

          # 🔴 ONE script, shared with scripts/osm-pipeline/import.sh.
          #
          # This step used to carry its own copy of the filter and the
          # export, and the copy is what ships: this workflow builds the
          # published data release, while import.sh is what somebody runs
          # by hand. So when CAMP-253 fixed the duplicate-and-stray-node
          # bug in import.sh, it fixed the half that does not ship —
          # review reproduced the untouched path here on Austria and got
          # exactly the state the fix claimed to have removed: 1 493
          # features, 116 gates and flagpoles, 603 duplicate copies.
          #
          # Two copies of a rule is one rule and one decoration, and
          # nothing in either file says which is which.
          scripts/osm-pipeline/extract-campsites.sh \
            "$SLUG.osm.pbf" "out/$SLUG.geojson"

          # 🔴 The PBF is NOT removed here any more (CAMP-113): the route-POI
          # step below reads the same file. It is removed there. France is
          # 5.1 GB, the route-POI intermediates add ~200 MB, and the runner
          # has about 14 GB free.
          rm -f "$SLUG.filtered.osm.pbf"

          COUNT=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['features']))" "out/$SLUG.geojson")
          echo "$REGION: $COUNT features"

          # 🔴 Zero is never right for a European country and almost
          # always means the filter or the download broke. Failing here
          # keeps a file that would blank a country out of the release.
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::$REGION produced 0 campsites — refusing to publish it"
            exit 1
          fi

          gzip -9 "out/$SLUG.geojson"
          # The publish job sums these rather than decompressing nine
          # files to count what this job already knows.
          # 🔴 The extract's OWN date, not the build date. Review found
          # the release claiming "built from Geofabrik's daily exports on
          # <today>" while the file could be up to a week older, and the
          # real date existed nowhere but one line of job log.
          echo "$REGION $COUNT $YMD" > "out/$SLUG.count"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "ymd=$YMD" >> "$GITHUB_OUTPUT"
          ls -lh out/

      - name: Hand the file to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: extract-${{ steps.build.outputs.slug }}
          path: out/
          # Short on purpose: this is a courier between two jobs of the
          # same run, not storage. Storage is the release below.
          retention-days: 1

      # 🔴 CAMP-113: the second layer, from the PBF the step above verified
      # and kept. AFTER the campsite artifact is uploaded, so that a failure
      # here costs this country's route POI and never its campsites. ONE
      # script, shared with nothing but itself on purpose: it sources the
      # same tag list load-route-poi.sh uses (route-poi-filters.sh) and the
      # same export config (export-rpoi.json), and it refuses a result of 0
      # features — a country of nothing is a broken filter, and an import
      # of it would read as "every POI here has gone".
      #
      # The script prints the count on stdout and everything else on
      # stderr, so there is one count and it is the script's.
      - name: Route POI from the same extract
        id: rpoi
        if: steps.build.outcome == 'success'
        env:
          REGION: ${{ matrix.region }}
          SLUG: ${{ steps.build.outputs.slug }}
          YMD: ${{ steps.build.outputs.ymd }}
        run: |
          set -euo pipefail
          mkdir -p rpoi
          COUNT=$(scripts/osm-pipeline/extract-route-poi.sh \
            "$SLUG.osm.pbf" "rpoi/$SLUG.rpoi.geojson")
          # Now nothing needs the PBF.
          rm -f "$SLUG.osm.pbf"
          gzip -9 "rpoi/$SLUG.rpoi.geojson"
          # Same shape as the campsite .count: region, features, extract date.
          echo "$REGION $COUNT $YMD" > "rpoi/$SLUG.rpoi.count"
          echo "$REGION: $COUNT route POI features"
          ls -lh rpoi/

      - name: Hand the route-POI file to the publish job
        if: steps.rpoi.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: rpoi-${{ steps.build.outputs.slug }}
          path: rpoi/
          retention-days: 1

  publish:
    needs: [plan, extract]
    # `always()` so a release still happens when one country failed —
    # eight countries of fresh data beat none. The completeness check
    # below is what makes the gap loud instead of silent.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      # v7, not v8. One version behind on purpose — the same rule we
      # gave Dependabot in its cooldown: let a major release be looked at
      # by other people for a fortnight first. Dependabot will offer v8
      # when its own cooldown expires.
      - uses: actions/download-artifact@v8
        with:
          pattern: extract-*
          merge-multiple: true
          path: out
      # The route-POI courier (CAMP-113), into its own directory so that the
      # campsite counts below never read a .rpoi.count by accident.
      - uses: actions/download-artifact@v8
        with:
          pattern: rpoi-*
          merge-multiple: true
          path: rpoi

      - name: Check what arrived
        id: check
        env:
          PLANNED: ${{ needs.plan.outputs.count }}
        run: |
          set -euo pipefail
          mkdir -p out
          GOT=$(find out -name '*.geojson.gz' | wc -l | tr -d ' ')
          echo "got=$GOT planned=$PLANNED"

          # Nothing at all means every country failed. There is no
          # release to make and the alert below is the whole output.
          if [ "$GOT" -eq 0 ]; then
            echo "::error::no region produced an extract"
            echo "complete=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOTAL=$(cat out/*.count | awk '{s+=$2} END {print s}')
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "got=$GOT" >> "$GITHUB_OUTPUT"
          if [ "$GOT" -lt "$PLANNED" ]; then
            echo "complete=partial" >> "$GITHUB_OUTPUT"
          else
            echo "complete=full" >> "$GITHUB_OUTPUT"
          fi

          # CAMP-113: the route-POI layer, counted apart. Zero here is not
          # "none" for the release — the campsites still publish — but it
          # is printed, and the import on the machine fails by name for
          # every country the release does not hold.
          mkdir -p rpoi
          RPOI_GOT=$(find rpoi -name '*.rpoi.geojson.gz' | wc -l | tr -d ' ')
          RPOI_TOTAL=0
          if [ "$RPOI_GOT" -gt 0 ]; then
            RPOI_TOTAL=$(cat rpoi/*.rpoi.count | awk '{s+=$2} END {print s}')
          fi
          echo "route POI: got=$RPOI_GOT planned=$PLANNED features=$RPOI_TOTAL"
          echo "rpoi_got=$RPOI_GOT" >> "$GITHUB_OUTPUT"
          echo "rpoi_total=$RPOI_TOTAL" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.check.outputs.complete != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETE: ${{ steps.check.outputs.complete }}
          TOTAL: ${{ steps.check.outputs.total }}
          GOT: ${{ steps.check.outputs.got }}
          PLANNED: ${{ needs.plan.outputs.count }}
          RPOI_GOT: ${{ steps.check.outputs.rpoi_got }}
          RPOI_TOTAL: ${{ steps.check.outputs.rpoi_total }}
          SUBSET: ${{ github.event_name == 'workflow_dispatch' && inputs.regions != '' }}
        run: |
          set -euo pipefail

          # 🔴 ЗАПУСК НА ПІДМНОЖИНУ НЕ СТВОРЮЄ НОВОГО РЕЛІЗУ.
          #
          # Сталося 03.11.2026. Тижневий прогін лишив реліз без Франції
          # й Німеччини; я запустив воркфлоу руками на ці дві країни —
          # і він опублікував НОВИЙ реліз `osm-2026-11-03` рівно з
          # однією Німеччиною всередині.
          #
          # `import-release.mjs` бере НАЙНОВІШИЙ реліз за датою в тезі
          # (`latestTag`) і позначки `complete=partial` не читає. Тобто
          # нічний імпорт узяв би набір із однієї країни замість
          # учорашнього з двадцяти пʼяти — і впав би на другій.
          #
          # Тобто ручний запуск, задуманий ЗАПОВНИТИ дірку, витісняв
          # повний набір. Тепер підмножина доливається в найновіший
          # наявний реліз, а новий дата-тег створює лише повний прогін
          # (за розкладом або `workflow_dispatch` без `regions`).
          if [ "$SUBSET" = 'true' ]; then
            TAG="$(gh release list --limit 20 --json tagName                      --jq '[.[].tagName | select(test("^osm-\\d{4}-\\d{2}-\\d{2}$"))] | first // ""')"
            if [ -z "$TAG" ]; then
              echo "::warning::підмножина, але жодного релізу osm-* ще немає — створюю новий"
              TAG="osm-$(date -u +%Y-%m-%d)"
            else
              echo "підмножина доливається в наявний реліз $TAG, нового не створюю"
            fi
          else
            TAG="osm-$(date -u +%Y-%m-%d)"
          fi

          {
            # 🔴 The build date is NOT the data date, and saying so was a
            # lie waiting to happen: a region's extract can be several
            # days older than this run. Each row now carries the date of
            # the file it was actually built from.
            echo "Campsite extract built on $(date -u +%Y-%m-%d) from Geofabrik's OpenStreetMap exports."
            echo "Each region shows the date of the extract it was built from — they are not all the same day."
            echo
            echo "| region | campsites | extract |"
            echo "| --- | --- | --- |"
            sort out/*.count | awk '{printf "| %s | %s | 20%s-%s-%s |\n", $1, $2, substr($3,1,2), substr($3,3,2), substr($3,5,2)}'
            echo
            echo "**$TOTAL campsites across $GOT of $PLANNED regions.**"
            if [ "$COMPLETE" = 'partial' ]; then
              echo
              echo "> ⚠️ Incomplete: $((PLANNED - GOT)) region(s) failed to build."
              echo "> The regions listed above carry the extract date they were"
              echo "> built from; the missing ones keep"
              echo "> whatever an earlier release holds. See the run log."
            fi
            echo
            # 🔴 The command must match what this release actually holds.
            #
            # These notes told the reader to run import.sh on a
            # `<file>.osm.pbf`, and the assets below are `.geojson.gz` —
            # the PBFs never leave the runner. Anyone following the
            # instruction downloads an asset the command cannot open.
            # Instructions that do not run are worse than none: they are
            # believed first and debugged second.
            echo "Import the whole release with:"
            echo '```'
            echo "node scripts/osm-pipeline/import-release.mjs --tag $TAG"
            echo '```'
            echo
            echo "Or one member state at a time:"
            echo '```'
            echo "node scripts/osm-pipeline/import-release.mjs --tag $TAG fr si"
            echo '```'
            echo
            # 🔴 CAMP-113: the second layer in the same release. Its own
            # table and its own import command, because its own importer
            # reads it (import-route-poi.mjs), and because a reader must be
            # able to see that a country has campsites but no route POI.
            echo "## Route POI"
            echo
            if [ "$RPOI_GOT" -gt 0 ]; then
              echo "Fuel, charging, water, dump stations, rest areas, shops, food and lodging (\`*.rpoi.geojson.gz\`), cut from the same extracts."
              echo
              echo "| region | route POI | extract |"
              echo "| --- | --- | --- |"
              sort rpoi/*.rpoi.count | awk '{printf "| %s | %s | 20%s-%s-%s |\n", $1, $2, substr($3,1,2), substr($3,3,2), substr($3,5,2)}'
              echo
              echo "**$RPOI_TOTAL route POI features across $RPOI_GOT of $PLANNED regions.**"
              if [ "$RPOI_GOT" -lt "$PLANNED" ]; then
                echo
                echo "> ⚠️ Incomplete: $((PLANNED - RPOI_GOT)) region(s) have no route-POI file in this release. The import names each of them and leaves their rows as they were."
              fi
              echo
              echo "Import with:"
              echo '```'
              echo "node scripts/osm-pipeline/import-route-poi.mjs --tag $TAG"
              echo '```'
            else
              echo "> ⚠️ No region produced a route-POI file in this run. \`import-route-poi.mjs\` will fail by name for every member state; nothing in \`osm_route_poi\` changes."
            fi
            echo
            # 🔴 ODbL requires attribution and the licence notice from
            # anyone who redistributes the database — and publishing a
            # release asset is redistribution, not display. See
            # /legal/attribution for the same notice on the site.
            echo '---'
            echo
            echo "Contains information from [OpenStreetMap](https://www.openstreetmap.org/),"
            echo "which is made available under the [Open Database License (ODbL)](https://opendatacommons.org/licenses/odbl/1-0/)."
            echo "© OpenStreetMap contributors. Extracts by [Geofabrik](https://download.geofabrik.de/)."
          } > notes.md

          # The assets: campsites always (COMPLETE is not 'none' here), route
          # POI when any arrived. An array, because a glob that matches
          # nothing would be handed to gh as a literal file name.
          ASSETS=(out/*.geojson.gz out/*.count)
          if [ "$RPOI_GOT" -gt 0 ]; then
            ASSETS+=(rpoi/*.rpoi.geojson.gz rpoi/*.rpoi.count)
          fi

          # A re-run on the same day updates the day's release instead of
          # failing on the existing tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 🔴 ПІДМНОЖИНА ДОПИСУЄ НОТАТКИ, А НЕ ПЕРЕПИСУЄ ЇХ.
            #
            # `notes.md` будується з `out/*.count`, тобто рівно з того,
            # що зібрав ЦЕЙ прогін. Для повного прогону це вся правда;
            # для доливу двох країн у реліз із двадцяти семи це було б
            # твердження, що в релізі дві країни — при тому, що файли
            # решти двадцяти пʼяти лежать на місці (`upload --clobber`
            # замінює лише названі).
            #
            # Тобто дані були б правильні, а нотатки брехали б — і
            # читає людина саме нотатки.
            if [ "$SUBSET" = 'true' ]; then
              gh release view "$TAG" --json body --jq .body > old-notes.md
              {
                cat old-notes.md
                echo
                echo "---"
                echo
                echo "### Долито $(date -u "+%Y-%m-%d %H:%M") UTC"
                echo
                echo "Запуск на підмножину додав у цей реліз: **$(sort out/*.count | awk '{printf "%s ", $1}')**."
                echo
                echo "Таблиця вище описує прогін, яким реліз створено, і цих регіонів може не називати."
                echo "Повний перелік того, що в релізі зараз, — у вкладеннях."
              } > merged-notes.md
              gh release edit "$TAG" --notes-file merged-notes.md
            else
              gh release edit "$TAG" --notes-file notes.md
            fi
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            # 🔴 Pre-release on purpose. These are weekly data snapshots;
            # marking one "Latest release" would put a geojson dump at the
            # top of the repository page as though it were the product.
            gh release create "$TAG" "${ASSETS[@]}" \
              --prerelease \
              --title "OSM campsites — $(date -u +%Y-%m-%d)" \
              --notes-file notes.md
          fi
          echo "published $TAG"

      # ⏸ Blocked on CAMP-97 (Cloudflare payment card / R2 vs VPS decision).
      # 🔴 The secret is tested through env, not read directly in `if`.
      #
      # My previous "fix" here put `secrets.X` straight into the step's
      # `if`, on the belief that `env` did not work there. That was wrong
      # in the worst way: it made the whole workflow file unparseable, so
      # GitHub failed the run in 0s with no jobs on every push for two
      # days — and because the failure is a config error, it produces no
      # log to read. Hence the workflow-lint step in CI.
      - name: Upload to R2
        if: steps.check.outputs.complete != 'none' && env.HAS_R2 == 'true'
        env:
          HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          pip install --quiet awscli
          aws s3 sync out/ "s3://camptribe-osm/$(date -u +%Y-%m-%d)/" \
            --endpoint-url "$R2_ENDPOINT"

      # 🔴 Weekly releases accumulate at 52 a year. Without this the
      # release list becomes unreadable and the useful one — the newest —
      # is buried. Half a year of history is far more than any import
      # needs, and the raw data is always rebuildable from Geofabrik.
      - name: Prune data releases older than the last 26
        if: steps.check.outputs.complete != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The pattern is exact on purpose: only tags this workflow
          # creates can match, so nothing a human tagged is reachable
          # from here even by accident.
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^osm-[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | sort -r \
            | tail -n +27 \
            | while read -r OLD; do
                echo "pruning $OLD"
                gh release delete "$OLD" --yes --cleanup-tag
              done

      - name: Summary
        if: always()
        run: |
          {
            echo "### OSM weekly extract"
            echo ""
            echo "- regions: **${{ steps.check.outputs.got }} of ${{ needs.plan.outputs.count }}**"
            echo "- campsites: **${{ steps.check.outputs.total }}**"
            echo "- route POI: **${{ steps.check.outputs.rpoi_total }}** across **${{ steps.check.outputs.rpoi_got }} of ${{ needs.plan.outputs.count }}** regions (CAMP-113)"
            echo "- release: \`osm-$(date -u +%Y-%m-%d)\` (kept, not expiring)"
            # 🔴 WHAT GREEN MEANS HERE. This run ends at the release: no step
            # of it touches the database, by design (see the header). A green
            # run therefore says "the extract was built", and 28.10.2026 showed
            # it being read as "the data is updated" — `camping_spots` sat on
            # 17.10 under a week of green runs because nothing took the release
            # to the machine. The line says so where the person looks.
            echo "- imported into the database: **not by this workflow.** The server's \`camptribe-osm-import.timer\` (infra/systemd) imports the newest release's campsites on Tuesdays at 04:30 UTC, and \`camptribe-route-poi-import.timer\` its route POI at 05:30 UTC."
          } >> "$GITHUB_STEP_SUMMARY"

  # 🔴 A scheduled run that fails at 04:00 on a Monday fails to nobody.
  #
  # GitHub emails the person who last touched the workflow file, which is
  # whoever happened to edit it — not necessarily anyone watching. And a
  # weekly job can be broken for a month before the symptom (stale map
  # data, campsites wrongly counted as missing) becomes visible on the
  # site. So a failure opens an issue, which is loud, free and needs no
  # third-party service.
  #
  # It updates the open issue instead of filing a new one each week: a
  # watchdog that produces four identical issues a month gets muted, and
  # a muted watchdog is worse than none.
  #
  # 🔴 This cannot catch the workflow not running at all — a job with
  # `if: failure()` needs a run to fail. That is what watchdog.yml is for.
  alert:
    needs: [plan, extract, publish]
    # 🔴 `cancelled` ТЕЖ, і це не про людину з кнопкою.
    #
    # Завдання, вбите `timeout-minutes`, GitHub позначає `cancelled`, а
    # не `failure`. 02.11.2026 три країни зависли, були вбиті по
    # таймауту — і ця умова не спрацювала: реліз вийшов неповним, issue
    # ніхто не відкрив, і дізналися ми про це лише тому, що імпорт на
    # машині запустили руками.
    #
    # Хибного спрацювання на ручній відміні боятись не треба: коли
    # відміняють ПРОГІН, GitHub відміняє і цю роботу разом з усіма, тож
    # вона не почнеться. `cancelled` серед `needs` досяжний практично
    # лише через таймаут окремого завдання — тобто саме через те, що ми
    # й хочемо почути.
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # 🔴 GH_REPO, because this job does not check the repository out.
      #
      # `gh` resolves the repository from the git remote, not from
      # GITHUB_REPOSITORY. Without either a checkout or this variable
      # every call dies with "not a git repository" — and the alarm about
      # a broken extract says nothing at all.
      #
      # This is not a hypothetical. The job's `if:` only fires on a
      # failure, every earlier run of this workflow was green, so it had
      # never run once. On 19.10.2026 at 04:37 UTC it ran for the first
      # time (run 39199081913, 23 of 27 regions timed out on Geofabrik)
      # and died on its first `gh` call. backup-verify.yml:265 had
      # carried the fix and the explanation since CAMP-58; this file was
      # written without it (CAMP-347).
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='🔴 Weekly OSM extract is failing'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          BODY="The scheduled OSM extract failed, in whole or for some regions.

          Run: $RUN_URL

          While this is broken the campsite data simply stops being
          refreshed: closures, new sites and tag changes never arrive, and
          nothing on the site looks wrong. That is why it needs an alert
          rather than a symptom.

          A partial failure still publishes a release for the regions that
          worked — check the run log for which region failed and why."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            # 🔴 No --label. This repository has no `ci` label and
            # `gh issue create` aborts on one it cannot resolve, so the
            # branch that runs on the FIRST failure — when there is no
            # issue to comment on — is exactly the branch that would
            # fail. Measured 19.10.2026: `gh label list` returns 14
            # labels and `ci` is not among them. backup-verify.yml:294
            # says the same thing; this file did not.
            gh issue create --title "$TITLE" --body "$BODY"
          fi
