name: CI

on:
  # 🔴 Every branch, not only main. CAMP-34 through CAMP-39 all added CI
  # steps and none of them ever ran: the work lives on a feature branch,
  # there was no PR, and this only triggered on main. "Wired into CI" was
  # true of the file and false of reality for two days.
  # 🔴 CAMP-334: push будується ЛИШЕ в main, і це знімає цілий клас.
  #
  # Доки CI бігав на пуш у БУДЬ-ЯКУ гілку, push- і PR-прогони ділили
  # одну роботу й воювали за неї. Заміряно за добу: 47 прогонів, 26
  # скасовано, і двічі це дало нуль перевірки під трьома зеленими
  # рядками — пізніший push скасовував прогін PR, а сам через ворота
  # пропускав усі вісім джоб.
  #
  # 🔴 І РОЗДІЛИТИ ЧЕРГИ ЗА ПОДІЄЮ БУЛО НЕ ЛІКОМ, А ОБМІНОМ. Рецензія
  # показала: ворота питають «чи є відкритий PR», а він зʼявляється на
  # 16 секунд пізніше за push. Тобто перший пуш нової гілки будувався б
  # ПОВНІСТЮ, і PR-прогін будувався б повністю ще раз — рівно та
  # дуплікація, яку прибрала CAMP-269.
  #
  # Коли push у гілку не будується взагалі, обох бід немає: на гілці
  # працює рівно один прогін — від pull_request. Ціна названа чесно:
  # до відкриття PR гілку не перевіряє ніхто, тож перевірку перед
  # пушем робить scripts/dev/pre-push.sh.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 🔴 The only way to regenerate a visual baseline on the machine that
  # owns it.
  #
  # The `visual` job's comment has always said "re-run with
  # --update-snapshots and commit what comes back" — and there was no way
  # to re-run anything on this runner, so the only route was to generate
  # them on a Mac, which the {platform} suffix exists precisely to
  # prevent. A documented process nobody can perform is not a process.
  #
  # The new files come back as an artifact rather than as a commit from a
  # bot: the point of the step is that a person looks at the diff first,
  # and a self-committing baseline is the rubber stamp that comment warns
  # about.
  workflow_dispatch:
    inputs:
      update-visual-baselines:
        description: 'Regenerate the visual baselines and upload them'
        type: boolean
        default: false

# Repo is public for unlimited free Actions minutes (see docs/ci-and-public-repo.md).
# Rule that follows from that: never print user data, emails, or secrets to logs -
# public repo logs are readable by any logged-in GitHub account.

# The fixture database every job that builds pages runs against.
# Credentials are throwaway and local to the runner; nothing here is a secret.
env:
  CI_DATABASE_URL: postgres://postgres:postgres@localhost:5432/camptribe_test
  # CAMP-92. One value, used twice in the e2e job: once to build the
  # bundle (NEXT_PUBLIC_* is inlined at build time) and once for the test
  # process, because the security spec recomputes the expected CSP from
  # the same environment. Two copies of this string would drift, and the
  # symptom would be a CSP mismatch that looks like a security regression.
  CI_ERROR_ENDPOINT: http://localhost:3001/client-errors

# 🔴 ДРУГА ПОЛОВИНА ДЕДУПЛІКАЦІЇ (CAMP-269), І ВОНА ПОТРІБНА САМЕ ТОМУ,
# ЩО ВОРОТА НЕ ВСЕМОГУТНІ.
#
# Заміряно на цьому ж PR: push-прогін створено о 18:00:32, а pull request
# з'явився о 18:00:48 — через ШІСТНАДЦЯТЬ секунд. Коли ворота питали
# «чи є відкритий PR», його ще не існувало, тож вони чесно відповіли
# «будуємо». Для PR з одного коміта — а такі тут більшість — ворота не
# заощаджують нічого.
#
# Спільна група для обох подій це закриває: `head_ref` для pull_request
# це назва гілки, `ref_name` для push — вона ж, тож обидва прогони
# потрапляють в одну групу, і пізніший (а це завжди pull_request)
# скасовує ранішій.
#
# 🔴 Але НЕ на гілці за замовчуванням. Там скасування означало б коміт
# у main, який ніхто не добудував — рівно та діра, яку лагодить цей PR.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

# 🔴 CAMP-275. ЦЕ БЛАСТ-РАДІУС, А НЕ ПРИБИРАННЯ.
#
# 🔴 І ПЕРША ПОЛОВИНА ЦЬОГО КОМЕНТАРЯ ВЖЕ НЕПРАВДА — лишаю її, бо вона
# пояснює, чому права нижче звужені, але виправляю твердження.
#
# Тут було написано «без патча і без перспективи його мати». Патча для
# САМОГО `extract-zip` справді немає й досі (остання версія 2.0.1 і є
# вразливою). Але пакет можна прибрати з дерева, і 13.10.2026 це
# зроблено: `lighthouse@13` перейшов на `puppeteer-core@25` →
# `@puppeteer/browsers@3`, який `extract-zip` не тягне взагалі. Заважав
# лише `@lhci/cli@0.15.1`, що пришпилює `lighthouse` рівно до 12.6.1 —
# знято через `overrides` у корені. Обидва `high` зникли з дерева.
#
# Урок на себе: «немає виправлення для пакета» і «немає виправлення»
# — різні твердження, і я прийняв перше за друге.
#
# Лишився один алерт — `sprintf-js` (medium), і для нього виправлення
# справді немає: ланцюг `ts-jest` → … → `@istanbuljs/load-nyc-config`,
# а той покинутий на версії 1.1.0 і хоче `js-yaml@^3`. При цьому
# `js-yaml@3` вантажить `argparse` лише у своєму `bin/js-yaml.js` —
# бібліотечний код його не чіпає, тож `sprintf-js` у нас не виконується
# взагалі.
#
# Права нижче лишаються звуженими в будь-якому разі: ланцюг був
# `@lhci/cli` → `lighthouse` → `puppeteer-core` → `@puppeteer/browsers`
# → `extract-zip`, і наступний такий пакет прийде тим самим шляхом.
#
# Дефект `extract-zip` — довільний запис файлів через симлінк в архіві.
# Чого він вартий нападнику, вирішує не версія пакета (виправленої
# немає), а те, що може `GITHUB_TOKEN` цього раннера.
#
# Заміряно 13.10.2026: шість воркфлоу з семи оголошували `permissions`.
# Сьомим був цей — найбільший, 18 джоб, кожна з яких збирає сайт і
# запускає наші скрипти. Він брав типові права репозиторію, тобто
# налаштування поза цим файлом, якого не видно в рецензії.
#
# 🔴 ЦЕЙ КОМЕНТАР РАНІШЕ БРЕХАВ, і рецензія це заміряла. Він казав, що
# єдине, що тут торкається GitHub, — `actions/upload-artifact`. Насправді
# джоба `gate` нижче ставить `GH_TOKEN: ${{ github.token }}` і читає
# `/commits/{sha}/pulls` через `should-build.sh`. Висновок випадково
# лишався правильним, але підставу прочитав би наступний, хто додає крок
# із API, — тому вона тут названа, а `gate` оголошує своє право сама.
#
# Решті джоб вистачає читання: `upload-artifact` користується токеном
# рантайму Actions, а не `GITHUB_TOKEN`. Секретів ці джоби не бачать —
# `build-site` вживає одноразові рядки (`ci-build-token`), не `secrets.*`.
permissions:
  contents: read

jobs:
  # 🔴 ONE RUN PER COMMIT (CAMP-269).
  #
  # `ci.yml` listens to both `push: ['**']` and `pull_request`, so a
  # branch with an open PR is built TWICE on the same commit. Measured
  # over the last 100 runs (06–11.10.2026): 58 unique commits, 40 of
  # them built twice, 777 wasted minutes in five days. The e2e job alone
  # is 23 minutes, so a merge waits for a duplicate of a suite that has
  # already passed.
  #
  # Both triggers are kept, because each answers a different question
  # and the repository has been bitten by dropping either:
  #
  #   · `pull_request` builds the MERGE of the branch with current main —
  #     that is what actually ships.
  #   · `push: ['**']` exists because CAMP-34…CAMP-39 added CI steps that
  #     never ran: the work sat on a branch with no PR.
  #
  # So instead of dropping a trigger, the push run steps aside when the
  # commit already has a pull request — which is exactly when the better
  # of the two runs exists.
  #
  # 🔴 FAIL-SAFE IS "RUN". If the API cannot be asked, this says yes.
  # A gate that goes quiet on error would stop CI without failing, which
  # is the silent shape this repository keeps finding in its guards.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 🔴 Джоба читає відкриті PR коміта, щоб не будувати те саме двічі
    # (CAMP-269). На публічному репозиторії це проходить і з самим
    # `contents: read`, бо публічні дані читає будь-хто — тобто сьогодні
    # цей рядок нічого не змінює. Він тут, щоб назвати ПОТРЕБУ: стане
    # репозиторій приватним — ворота мовчки впадуть у fail-open, і
    # причину шукатимуть не тут.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      # 🔴 Рішення живе в scripts/ci/should-build.sh, а не тут: інлайн
      # у YAML неможливо прогнати, а в нього сім випадків, серед яких
      # три різні поломки, що всі мусять дати «будуємо».
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          r=$(scripts/ci/should-build.sh '${{ github.event_name }}' '${{ github.repository }}' '${{ github.sha }}' '${{ github.ref_name }}' '${{ github.event.repository.default_branch }}')
          echo "run=$r" >> "$GITHUB_OUTPUT"
          echo "::notice::${{ github.event_name }} на ${{ github.sha }} → build=$r"

  security:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 🔴 The repo is public and the owner has had a leak before. Two
      # steps, as everywhere: first prove the scanner still catches a
      # planted secret, then believe the run that says the tree is clean.
      # 🔴 CAMP-285: the step reads the self-test's own output.
      # `set -o pipefail` because Actions runs `bash -e {0}` WITHOUT it,
      # so a failing node on the left of a pipe is invisible. The grepped
      # line names its own script, so no other self-test can satisfy it.
      - name: Secret scanner still catches a planted secret
        run: |
          set -o pipefail
          node scripts/security/check-secrets.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-secrets self-test:' >/dev/null
      - name: No secrets in tracked files
        run: node scripts/security/check-secrets.mjs

      # CAMP-353. Копія безпекового журналу живе на ноутбуці власника, а
      # не в репозиторії; у її рядках справжні адреси читачів. Сторож
      # дивиться в ІНДЕКС git, бо `.gitignore` описує намір, а не стан.
      # `grep -c` на іменований рядок — бо «самотест не стартував» і
      # «всі випадки пройшли» друкують однакове: нічого.
      - name: Log guard still catches a planted address
        run: |
          set -o pipefail
          node scripts/ci/check-no-log-in-git.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-no-log-in-git self-test:' >/dev/null
      - name: No security-log data in tracked files
        run: node scripts/ci/check-no-log-in-git.mjs
      # CAMP-355. Адреса продакшн-машини лежала в трьох файлах публічного
      # репозиторію, а сторож дрейфу двічі пояснював, чому її там «немає».
      # Правило поставлене навпаки — не «заборонити цей рядок» (тоді сам
      # сторож став би місцем, де адреса записана), а «кожна публічна
      # адреса названа з причиною». Нашої в переліку немає й не буде.
      # Два окремі кроки, по одному самотесту в кожному: сторож
      # check-selftest-steps читає крок як ціле й не може приписати
      # другий виклик, а невидимий йому крок — це крок, що лишив огляд
      # у тиші.
      - name: Address classifier still tells ours from documentation
        run: |
          set -o pipefail
          node scripts/lib/ip.mjs --self-test | tee /dev/stderr \
            | grep -c 'ip self-test:' >/dev/null
      - name: Address guard still catches an unlisted address
        run: |
          set -o pipefail
          node scripts/ci/check-public-addresses.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-public-addresses self-test:' >/dev/null
      - name: Every public address in the tree is accounted for
        run: node scripts/ci/check-public-addresses.mjs

      # 🔴 Реєстр за ст. 30 GDPR описує, що ми СПРАВДІ обробляємо. Його
      # питає наглядовий орган, а не сторінку політики. Розбіжність між
      # реєстром і сутностями — це неправда, а не неохайність, тому
      # сторож стоїть у CI, а не в календарі вичитки.
      - name: Register guard still catches an unlisted entity
        run: |
          set -o pipefail
          node scripts/ci/check-gdpr-register.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-gdpr-register self-test:' >/dev/null
      - name: Every entity with personal data is in the Article 30 register
        run: node scripts/ci/check-gdpr-register.mjs

      # 🔴 Дані, що протухають мовчки, — це сайт, який бреше читачеві.
      # Бюджети беруться з коду, який їх споживає, а не дублюються тут.
      - name: Freshness guard still catches stale data
        run: |
          set -o pipefail
          node scripts/ci/check-data-freshness.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-data-freshness self-test:' >/dev/null
      - name: Shipped data is inside its freshness budget
        run: node scripts/ci/check-data-freshness.mjs

      # Fails on an advisory nobody has looked at, not on every known
      # one — the reasoning is in scripts/security/known-advisories.json.
      #
      # 🔴 The self-test is here because this guard is the one that went
      # blind. Its workspace list was hand-written and stopped at two
      # entries while a third workspace was added, so it reported "no new
      # advisories" over 40 it could not see, one of them critical. The
      # first case it now asserts is exactly that: a workspace added later
      # must be discovered.
      # 🔴 CAMP-285: the step reads the self-test's own output.
      # `set -o pipefail` because Actions runs `bash -e {0}` WITHOUT it,
      # so a failing node on the left of a pipe is invisible. The grepped
      # line names its own script, so no other self-test can satisfy it.
      - name: Dependency guard still sees every workspace
        run: |
          set -o pipefail
          node scripts/security/check-dependencies.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-dependencies self-test:' >/dev/null
      - name: No new dependency advisories
        run: node scripts/security/check-dependencies.mjs

      # 🔴 A branch that grows past a card's worth of work stops being a
      # feature branch. On 22.09.2026 one carried 28 commits for days,
      # during which CodeQL and Dependabot reported on main and therefore
      # on none of it. docs/git-workflow.md has the whole account.
      # 🔴 CAMP-285: the step reads the self-test's own output.
      # `set -o pipefail` because Actions runs `bash -e {0}` WITHOUT it,
      # so a failing node on the left of a pipe is invisible. The grepped
      # line names its own script, so no other self-test can satisfy it.
      - name: Branch-drift guard still catches a stale branch
        run: |
          set -o pipefail
          node scripts/ci/check-branch-drift.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-branch-drift self-test:' >/dev/null
      - name: This branch has not drifted from main
        run: node scripts/ci/check-branch-drift.mjs

      # CAMP-118. The project serves the European Union, and that was a
      # sentence in CLAUDE.md until 24.09.2026, when the database turned
      # out to hold 13 Bosnian and 2 Serbian campsites nobody had added —
      # the OSM extracts cross borders. A rule nothing checks is a rule
      # that has already stopped applying.
      # 🔴 CAMP-285: the step reads the self-test's own output.
      # `set -o pipefail` because Actions runs `bash -e {0}` WITHOUT it,
      # so a failing node on the left of a pipe is invisible. The grepped
      # line names its own script, so no other self-test can satisfy it.
      - name: EU-scope guard still catches a non-member
        run: |
          set -o pipefail
          node scripts/ci/check-eu-scope.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-eu-scope self-test:' >/dev/null

      # The shared rule those four now use: a flag the script does not
      # know is an error, not a shrug.
      - name: The flag rule the self-tests share still refuses a typo
        run: |
          set -o pipefail
          node scripts/lib/entrypoint.mjs --self-test | tee /dev/stderr \
            | grep -c 'entrypoint self-test:' >/dev/null

      # 🔴 And the thing that makes the other 38 happen. A step converted
      # by hand and a step nobody has got to yet look identical from the
      # outside; this one keeps the list of the unconverted, refuses a
      # new self-test step that reads nothing, and refuses two steps that
      # grep for the same line.
      - name: Self-test steps still read their own output
        run: |
          set -o pipefail
          node scripts/ci/check-selftest-steps.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-selftest-steps self-test:' >/dev/null
      - name: The list of unlocked self-test steps has not grown
        run: node scripts/ci/check-selftest-steps.mjs
      # 🔴 CAMP-361. Directus повернувся, але ПОРУЧ із нами, не всередині.
      # Заміряно 20.10.2026: наше дерево 27 попереджень і 0 critical,
      # дерево CMS — 35 і 1 critical. Одне слово в `workspaces` зливає
      # їх назад, і це не падає ніде, крім цього сторожа.
      - name: CMS isolation guard still catches a merged tree
        run: |
          set -o pipefail
          node scripts/ci/check-cms-hardening.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-cms-hardening self-test:' >/dev/null
      - name: Directus stays out of our dependency tree and out of CI
        run: node scripts/ci/check-cms-hardening.mjs
      - name: The import list is the Union, and nothing else
        run: node scripts/ci/check-eu-scope.mjs
      # 🔴 CAMP-178. A job running a Node nobody chose is how a version
      # skew becomes permanent: `warning-geography` sat on 24 for weeks
      # because it was copied from a file that needed 24, and nothing in
      # the repository could tell the two apart.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: Node-version guard still catches an unexplained version
        run: |
          set -o pipefail
          node scripts/ci/check-node-versions.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-node-versions self-test:' >/dev/null
      - name: Every job runs .nvmrc's Node, or says why not
        run: node scripts/ci/check-node-versions.mjs

      # 🔴 CAMP-275. Три алерти без патча означають, що ціну вирішує не
      # версія пакета, а права токена. Цей воркфлоу був єдиним із семи,
      # що їх не оголошував.
      # 🔴 CAMP-285/286: крок читає власний вивід самотесту, під
      # `set -o pipefail`, бо Actions запускає `bash -e {0}` без нього.
      - name: Permissions guard still catches a workflow that says nothing
        run: |
          set -o pipefail
          node scripts/ci/check-workflow-permissions.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-workflow-permissions self-test:' >/dev/null
      - name: Every workflow says what its token may do
        run: node scripts/ci/check-workflow-permissions.mjs

      # CAMP-273. The daily watchdog over Dependabot pull requests names the
      # neighbours a bump left behind. It runs on its own schedule, where
      # nobody watches it, so what proves it still bites has to run here, on
      # every change: a watchdog that ships broken reports "fine" by never
      # reporting. The step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: Dependabot-PR watchdog still names what a bump left behind
        run: |
          set -o pipefail
          node scripts/ci/check-dependabot-prs.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-dependabot-prs self-test:' >/dev/null

      # 🔴 CAMP-287 крок 1. Перепис схем вирішує, чиї попередження ми
      # взагалі можемо зіставити з кемпінгом. Франція лежить у полігонах
      # EMMA на 97.5%, а попереджає в NUTS3 — коди в чужій схемі не
      # збігаються ні з чим, і цей самотест тримає саме цю межу.
      - name: Zone census still refuses a scheme the country never uses
