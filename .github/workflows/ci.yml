      # 🔴 CAMP-256. The date of the last OSM edit reaches the database only
      # if `extract-campsites.sh` asks osmium for it (`-a timestamp,version`),
      # and when it does not NOTHING fails: the campsites load, the counts
      # match, and every page says "Not known". The normaliser's self-test
      # above is handed a file and cannot see that; this builds a PBF from a
      # few lines of OPL and runs the real script on the real tool — and then
      # runs a copy with the flag removed and requires it to fail. osmium is
      # installed rather than shimmed because a shim that "supports -a"
      # would test the shim; the suite FAILS without it instead of skipping.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: Install osmium for the extract self-test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends osmium-tool

      - name: The extract carries each campsite's edit date, and refuses to load without it
        run: |
          set -o pipefail
          ./scripts/osm-pipeline/extract-campsites.selftest.sh | tee /dev/stderr \
            | grep -c 'extract-campsites self-test:' >/dev/null

      # 🔴 CAMP-119. The raw-extract counter is the oracle the stopping-place
      # import is reconciled against, so the thing that must not be wrong in
      # silence is how it reads OPL — `%2c%` taken for a URL escape comes
      # back as `,%`, and an escaped comma inside a value is not a separator
      # (decoding before splitting dropped the rest of the tag) — and what it
      # counts as a dump station: the AMENITY, and never the
      # `sanitary_dump_station=*` key on somebody else's object. Its
      # `access` filter is read in both directions, one object at a time.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: The raw-extract counter still reads OPL and still counts the amenity, not the key
        run: |
          set -o pipefail
          node scripts/osm-pipeline/count-rest-stops.mjs --self-test | tee /dev/stderr \
            | grep -c 'count-rest-stops self-test:' >/dev/null

      # 🔴 CAMP-327. The list-tag counter is the oracle a reload of the route
      # POI table is reconciled against: it counts the raw extracts under the
      # whole-value reading and under the elements of a `;` list, and what it
      # must not get wrong in silence is the difference between them — a list
      # (`restaurant;ice_cream`) is an element, a substring (`internet_cafe`),
      # a `,` list and a value that holds `key=value` are not, and the first
      # branch of the CASE wins. Its rules are compared with the loader's by
      # the API spec; this runs its own cases.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: The list-tag counter still reads a list as its elements and a substring as nothing
        run: |
          set -o pipefail
          node scripts/osm-pipeline/count-list-tags.mjs --self-test | tee /dev/stderr \
            | grep -c 'count-list-tags self-test:' >/dev/null

      # 🔴 CAMP-174. The CEMS language rule is enforced on panels the
      # suite can FIND, and it found them through hand-written
      # descriptors. Review built a drought panel and a /drought page
      # reading Copernicus EDO and printing "risk" and "Danger", changed
      # nothing else, and 653 of 653 tests stayed green. This asks where
      # a file gets its data instead of whether somebody registered it.
      - name: CEMS coverage guard still catches an unregistered panel
        # 🔴 CAMP-286. The step reads the self-test's own output, under
        # `set -o pipefail` because Actions runs `bash -e {0}` without it.
        # `grep -c … >/dev/null` and not `grep -q`: -q closes the pipe
        # early and the writer dies of SIGPIPE, which pipefail turns into
        # exit 141 — measured on five of five steps.
        run: |
          set -o pipefail
          node scripts/ci/check-cems-coverage.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-cems-coverage self-test:' >/dev/null

      - name: Everything showing CEMS data is inside the language guard
        run: node scripts/ci/check-cems-coverage.mjs

      # 🔴 The timestamp is the only thing TypeORM orders migrations by,
      # so two migrations sharing one are ordered by directory read order
      # — which differs between macOS and this runner. It cost nothing
      # the day it happened only because the two tables never referenced
      # each other. CAMP-179.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: Migration stamp guard still catches a collision
        run: |
          set -o pipefail
          node scripts/ci/check-migration-stamps.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-migration-stamps self-test:' >/dev/null

      - name: No two migrations share a timestamp
        run: node scripts/ci/check-migration-stamps.mjs

      # 🔴 CAMP-202. `osm/backfill-contact.ts` called `main()` at the
      # bottom with no `require.main` guard, and its spec imports one
      # constant from it. That import opened a Postgres client, ran
      # 14 954 UPDATEs and COMMITted them; the connection then outlived
      # Jest's teardown, `pg` could not `require('pgpass')` any more, and
      # the job exited non-zero with 1007 tests green.
      #
      # 15 of the 20 scripts that open a connection already had the
      # guard. The convention was real and nothing checked it, so five
      # files quietly did not follow it.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: Entry-point guard still tells guarded from unguarded
        run: |
          set -o pipefail
          node scripts/ci/check-script-entrypoints.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-script-entrypoints self-test:' >/dev/null

      - name: No script runs itself when a test imports it
        run: node scripts/ci/check-script-entrypoints.mjs

      # 🔴 CAMP-333. `grep -q` exits at the first match and closes the
      # pipe; the writer takes SIGPIPE; `pipefail` then reports the worst
      # code in the pipeline, so a successful match reads as a failure.
      # One run in ~1500 of move-table.selftest.sh went red that way on
      # 16.10.2026. Reproduced deliberately before the fix: above the
      # 65 536-byte pipe buffer it is 400 of 400, below it 0 of 400,
      # idle or under load. check-selftest-steps.mjs already refuses the
      # pattern in a workflow STEP; these two steps extend the same rule
      # to the 29 shell files and 7 workflows it never looked at, where 226
      # of them were.
      - name: The pipe-into-grep-q guard still tells a pipe from a herestring
        run: |
          set -o pipefail
          node scripts/ci/check-pipe-to-grep-q.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-pipe-to-grep-q self-test:' >/dev/null

      - name: Nothing in a shell file pipes into grep -q
        run: node scripts/ci/check-pipe-to-grep-q.mjs

      # 🔴 CAMP-385. 22.10.2026 `ss -ltn` на машині показав `*:3001`: API
      # слухало всі інтерфейси, бо main.ts викликав `app.listen(port)` без
      # адреси, а юніт поруч стверджував «слухає лише локально». Від
      # інтернету його тримало одне правило ufw за замовчуванням — і
      # маршрути /auth/*, що шлють справжню пошту, стояли за ним без Caddy
      # і без гейта. Сторож читає виклик через AST і червоніє без адреси,
      # на wildcard-рядку і на `??` (порожній HOST= у .env — заміряно —
      # дає listen(port, ''), а це знову всі інтерфейси).
      - name: The listen-address guard still tells a bare listen from a loopback one
        run: |
          set -o pipefail
          node scripts/ci/check-api-binds-loopback.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-api-binds-loopback self-test:' >/dev/null

      - name: The API never calls listen without an address
        run: node scripts/ci/check-api-binds-loopback.mjs

      # 🔴 CAMP-363. Хук скидання кешу лежав у apps/web/src/app/api/
      # revalidate/route.ts, а Caddy віддає ВЕСЬ префікс /api у Nest
      # (infra/caddy/camptribe.eu.caddyfile). Запит до Next не доходив,
      # Nest відповідав 404, і кеш мовчки не скидався: жодної помилки
      # ніде, а тест маршруту ходив у Next напряму й був зелений.
      # Сторож читає Caddyfile, бере порт Next із наскрізного handle (не
      # з константи) і червоніє, якщо хоч один обробник Next опинився під
      # префіксом, що йде в інший порт. Нуль префіксів чи нуль обробників
      # — теж провал: це зламаний розбір, а не «чисто».
      - name: The route-reachability guard still catches a route under a foreign prefix
        run: |
          set -o pipefail
          node scripts/ci/check-next-routes-reachable.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-next-routes-reachable self-test:' >/dev/null

      - name: Every Next route handler is reachable through Caddy
        run: node scripts/ci/check-next-routes-reachable.mjs

      # 🔴 CAMP-396. `dynamicParams = false` несумісний зі скиданням кешу
      # за міткою: заміряно на проді — один revalidateTag('navigation')
      # поклав 56 525 сторінок у 404 до перезапуску служби.
      - name: The dynamicParams guard still catches a page that cannot survive revalidation
        run: |
          set -o pipefail
          node scripts/ci/check-dynamic-params.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-dynamic-params self-test:' >/dev/null

      - name: No page sets dynamicParams = false
        run: node scripts/ci/check-dynamic-params.mjs

      # 🔴 CAMP-363. Сторож гачка ISR ходить на ЖИВИЙ сайт, тож повний
      # прогін тут неможливий: ні адреси, ні секрета, ні воріт у CI немає.
      # Але його ЯДРО — чисте, і саме воно вирішує, чи побачимо ми випадок
      # «200 віддано, а кеш не скинувся». Без цього кроку ядро не
      # перевіряється нічим, а сторож на машині мовчки зеленів би.
      - name: The ISR-hook guard still catches a hook that answers 200 and changes nothing
        run: |
          set -o pipefail
          node scripts/ci/check-isr-hook.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-isr-hook self-test:' >/dev/null

      # 🔴 CAMP-347. `gh` resolves the repository from the GIT REMOTE,
      # not from GITHUB_REPOSITORY, so a job with no checkout, no
      # GH_REPO and no --repo dies on its first call with "not a git
      # repository". The jobs that do this are ALARMS, gated on a
      # failure — so the defect waits until the day it matters. Measured:
      # osm-weekly.yml's alert job had never run (every earlier run was
      # green), ran for the first time on 19.10.2026 and died, and the
      # issue it exists to open was never opened.
      - name: The gh-needs-repo guard still tells a covered job from a bare one
        run: |
          set -o pipefail
          node scripts/ci/check-gh-needs-repo.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-gh-needs-repo self-test:' >/dev/null

      - name: Every job that calls gh can name its repository
        run: node scripts/ci/check-gh-needs-repo.mjs

      # 🔴 CAMP-221. The satellite base layer serves somebody else's
      # photographs. The mockup settled the policy — Esri, Bing and Google
      # are closed to us, orthophotos come from national open sources —
      # and a policy is not a licence. Each source has to name the licence
      # word for word, the credit shown to the reader, and the URL both
      # were read from, because a licence nobody can reproduce from a link
      # is one we are quoting from memory.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: Satellite licence guard still refuses an unlicensed tile
        run: |
          set -o pipefail
          node scripts/ci/check-satellite-licences.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-satellite-licences self-test:' >/dev/null

      - name: Every satellite source names its licence and its credit
        run: node scripts/ci/check-satellite-licences.mjs

      # 🔴 The numbers on the home page live in a PNG, and a PNG is
      # rewritten by `--update-snapshots` to agree with whatever the code
      # now does. CAMP-182: the headline went 71 → 72 unnoticed. These
      # two steps put the same numbers in a file a human has to edit.
      - name: Fixture-count guard still catches a moved number
        # 🔴 CAMP-286. The step reads the self-test's own output, under
        # `set -o pipefail` because Actions runs `bash -e {0}` without it.
        # `grep -c … >/dev/null` and not `grep -q`: -q closes the pipe
        # early and the writer dies of SIGPIPE, which pipefail turns into
        # exit 141 — measured on five of five steps.
        run: |
          set -o pipefail
          node scripts/ci/check-fixture-counts.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-fixture-counts self-test:' >/dev/null

      - name: The fixture still adds up to what the pages claim
        run: node scripts/ci/check-fixture-counts.mjs

      # 🔴 A broken workflow file is the failure that reports nothing.
      #
      # On 21.09.2026 a step in osm-weekly.yml was given
      # `if: ${{ secrets.X != '' }}`. `secrets` is not available in a
      # step condition, so the file became unparseable — and GitHub's
      # answer to an unparseable workflow is a run that fails in 0
      # seconds with no jobs and therefore no log to read. CI was down
      # for two days and the only visible symptom was a red tick.
      #
      # actionlint was checked against that exact commit before being
      # added here: it names the line and the reason. shellcheck comes
      # with the runner, so the `run:` bodies are checked too — which is
      # most of what these workflows are.
      #
      # Pinned to a version rather than a moving tag: an unpinned linter
      # can start failing the build because of somebody else's release.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          curl -sSL -o actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar xzf actionlint.tgz actionlint
          ./actionlint --version
      - name: Workflow files parse and their scripts are sane
        run: ./actionlint

      # The silence watchdog's own logic. The check that runs daily and
      # the check that is tested are the same file.
      # 🔴 CAMP-285/286: the step reads the self-test's own output.
      # `set -o pipefail` because Actions runs `bash -e {0}` WITHOUT it,
      # so a failing node on the left of a pipe is invisible. The grepped
      # line names its own script, so no other self-test can satisfy it.
      - name: Silence watchdog still catches a job that stopped
        run: |
          set -o pipefail
          node scripts/ci/check-schedule.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-schedule self-test:' >/dev/null

      # The uptime detector's own logic, before it ships to a schedule
      # where nobody watches it run. Same file the watchdog runs.
      # 🔴 CAMP-285/286: the step reads the self-test's own output.
      - name: Uptime watchdog still tells an outage from Basic Auth
        run: |
          set -o pipefail
          node scripts/ci/check-uptime.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-uptime self-test:' >/dev/null

      # 🔴 CAMP-30. Fonts and sprites are NOT inside a PMTiles archive; a
      # style names them by URL, and the obvious one points at GitHub
      # Pages, whose terms forbid "an online business, e-commerce site".
      # Nothing would break — we would simply be in breach, and the first
      # anyone heard of it would be a takedown. The trap arms itself the
      # day we adopt a style of our own, which is the day nobody will be
      # looking at this.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: Map fonts and sprites come from a host we may use
        run: |
          set -o pipefail
          node scripts/ci/check-map-assets.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-map-assets self-test:' >/dev/null

      - name: …and the live styles still do
        run: node scripts/ci/check-map-assets.mjs

      # 🔴 CAMP-222. --experimental-strip-types because the check IMPORTS
      # the palette module rather than parsing it: review showed a regex
      # over the source accepted `#FC3`, `rgb(...)` and an 8-digit hex
      # unmeasured, and the only way not to miss a notation is not to
      # parse one. The flag is a no-op on Node 24 and supported from 22.6.
      #
      # 🔴 CAMP-222. The map's type colours were chosen BY
      # MEASUREMENT: the headline theme colours were rejected because
      # Success reaches 2.91 and Brand 1.55 against the marker's white
      # stroke, under the 3.0 WCAG 1.4.11 asks of a non-text graphic.
      # A number that decided something and is then never checked is a
      # number that drifts — the next person picks a nicer green,
      # nothing fails, and the map stops being readable for exactly the
      # people who needed the contrast.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: The map palette check still rejects an illegible colour
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/ci/check-map-palette.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-map-palette self-test:' >/dev/null

      - name: …and every type colour is still legible and distinct
        run: node --experimental-strip-types scripts/ci/check-map-palette.mjs
      # 🔴 CAMP-217. Twelve design tokens had quietly failed to arrive and
      # nothing noticed for months, because nothing compared. The site had
      # ONE transition speed where the design has four, no secondary
      # button at all, and no state-label colours — each of which reads as
      # a styling choice rather than a missing line.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: The design-token check still catches a missing token
        run: |
          set -o pipefail
          node scripts/ci/check-design-tokens.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-design-tokens self-test:' >/dev/null

      - name: …and globals.css still matches the design system
        run: node scripts/ci/check-design-tokens.mjs

      # 🔴 CAMP-153. The wildfire fetch script carries a self-test of its
      # own — the `maxfeatures` throw that stands between us and a 132 MB
      # response, the 2 000-feature ceiling, both licence-marker checks and
      # the refusal to WRITE a word the CEMS terms reserve — and until this
      # line it ran only when a human typed the command. Nothing imported
      # the script and no job invoked it.
      #
      # ⚠️ And running it was not enough. Measured 29.09.2026, the old
      # self-test covered the `maxfeatures` throw and none of the other
      # four: deleting the ceiling, either marker loop or the write-refusal
      # left it at 49/49, because those guards live inside `collect()` and
      # `collect()` needed two live HTTP requests. It now takes its network
      # as an argument and the self-test runs the real thing against a
      # world it controls, so each of the four is watched failing here.
      #
      # Every other guard in this file has a step like this one; a
      # safeguard nobody has watched fail is a safeguard nobody has. It
      # touches no network and no database.
      #
      # `!cancelled()`, so it runs even when an earlier step has failed. It
      # is independent of them, and on 29.09.2026 that mattered: a new
      # advisory turned "No new dependency advisories" red, every step
      # after it was SKIPPED, and this one was skipped with them (run
      # 36536509099) — a guard that runs "unattended" only while everything
      # else is green is not the guard the step claims to be.
      - name: Wildfire fetch guards still refuse what they must
        if: ${{ !cancelled() }}
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
        run: |
          set -o pipefail
          node scripts/effis/fetch-wildfires.mjs --self-test | tee /dev/stderr \
            | grep -c 'fetch-wildfires self-test:' >/dev/null

      # 🔴 CAMP-162. The CEMS terms — which govern EFAS, GloFAS, GFM, EDO,
      # GDO, EFFIS and GWIS together — say the data "does not constitute in
      # any way an early warning for which only national/regional
      # institutions are authorized", and dictate the credit for data we
      # have modified. This renders the panel of every CEMS-sourced layer
      # exactly as the page does and reads the HTML: the credit must be
      # visible beside the data, and "warning", "danger", "risk" and
      # "alert" must be nowhere in it.
      #
      # It is bound to the SOURCE and not to a file on purpose. A grep over
      # the repository would go red on `map-layers.ts`, where "warnings"
      # is the correct name of the planned MeteoAlarm layer, and a check
      # that cries wolf gets silenced. Adding a source is adding one
      # `tests/unit/cems-panels/*.panel.ts`; the spec's header says how.
      #
      # The same spec also runs inside the e2e job's `unit` project. It is
      # here as well, on its own, because a named step that fails says
      # WHICH promise broke, and because this job needs no database, no
      # build and no browser — the spec renders components, it opens
      # nothing. `!cancelled()` for the reason the step above gives.
      - name: CEMS panels still carry their credit and none of the four words
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: npx playwright test --project=unit tests/unit/cems-panels.spec.ts --reporter=list

      # 🔴 CAMP-172. regenerate.sh rebuilt ci-seed.sql from a list of
      # sources kept by hand, and bathing_waters (43 rows, appended to the
      # fixture by hand) was in none of them: the next regeneration would
      # have deleted the table and every check would still have passed,
      # because a page with no bathing water nearby is a correct page. The
      # tool now refuses to write a fixture with fewer tables or fewer
      # rows than the one it replaces.
      #
      # Two steps, because there are two things to prove. The first is the
      # comparison itself (what counts as a row, what counts as shrunk, the
      # per-table escape hatch). The second is the wiring around it —
      # that regenerate.sh still calls the comparison, calls it before it
      # overwrites the fixture, and lets psql fail loudly — driven with a
      # psql shim and the REAL _select.sql, so deleting the bathing select
      # from it turns this red. Neither touches a database.
      - name: Fixture guard still refuses a smaller fixture
        if: ${{ !cancelled() }}
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
        run: |
          set -o pipefail
          node scripts/ci/check-fixture-not-shrunk.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-fixture-not-shrunk self-test:' >/dev/null
      - name: Regenerating the fixture still refuses to lose a table
        if: ${{ !cancelled() }}
        run: ./apps/api/test/fixtures/regenerate.selftest.sh

  web:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: camptribe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 🔴 CAMP-332. The OSM import no longer needs `gh` or `ogr2ogr`: it
      # reads the release as a stream and hands psql one COPY. ogr2ogr never
      # ran in CI (no GDAL here), so the shape of the staging table that
      # import-spots.ts reads was pinned by nothing at all. This runs the
      # loader against a REAL PostGIS and reads the table back — columns,
      # types, values, and that a failed load leaves the previous table as
      # it was. Node 22 because that is what the server runs.
      #
      # It makes and drops its own `camp332_*` database; the service's
      # `postgres` user may. A missing database is a FAILURE, not a skip.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: The OSM staging loader writes the table the importer reads
        env:
          CAMP_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: |
          set -o pipefail
          node scripts/osm-pipeline/import-release.mjs --self-test-db | tee /dev/stderr \
            | grep -c 'import-release db self-test:' >/dev/null

      - uses: ./.github/actions/build-site
        with:
          site-mode: closed
          database-url: ${{ env.CI_DATABASE_URL }}

      # 🔴 `--max-warnings=0`, бо попередження, яке ніколи не валить
      # збірку, — це попередження, якого ніхто не читає. Те саме
      # міркування вже записане нижче для apps/api, а тут його не було:
      # рецензія CAMP-156 заміряла мутацію, після якої `WEBCAM_NETWORK`
      # не вживався ніде, і єдиним слідом лишалось `'WEBCAM_NETWORK' is
      # defined but never used` — попередження, з яким CI був зелений.
      - run: npm run lint --workspace=apps/web -- --max-warnings=0

      # 🔴 `next build` typechecks only what the app imports, so nothing
      # ever looked at tests/ — the e2e specs were unchecked TypeScript
      # for as long as they have existed. Run separately, so a broken
      # test file fails here rather than at 2am in a Playwright run.
      - run: npm run typecheck --workspace=apps/web

      # CAMP-36. The acceptance criterion of the programmatic-SEO work is
      # that no generated page duplicates another by a swapped value. That
      # is invisible to a unit test — it only exists across pages, after
      # generation — so it is checked on the built output, here, and it
      # fails the build rather than being noticed six months later by a
      # ranking drop.
      # 🔴 The stripping rule BEFORE the guard that depends on it — not
      # before the build, which this job has already done by here. It
      # decides what the guard below is allowed to ignore, and a hole in
      # it does not go red, it goes green over text nobody compared. The
      # version this replaced could not match `</h2>`, so a marked
      # heading swallowed the paragraph after it.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: The boilerplate rule itself
        run: |
          set -o pipefail
          node scripts/seo/check-duplicate-pages.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-duplicate-pages self-test:' >/dev/null

      # CAMP-190. The campsite page prints a radius the API owns, and the
      # two were declared separately. No build or database needed.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: One webcam radius, not two
        run: |
          set -o pipefail
          node scripts/ci/check-webcam-radius.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-webcam-radius self-test:' >/dev/null
          node scripts/ci/check-webcam-radius.mjs

      - name: No near-duplicate generated pages
        run: node scripts/seo/check-duplicate-pages.mjs

      # 🔴 CAMP-163. The stripper this guard depends on had no rehearsal,
      # and that is how it shipped a pattern that stopped at the first
      # closing tag: a `data-boilerplate` block holding a link kept most
      # of its words in the comparison, inflating every pair in the same
      # direction. A guard whose own mechanism nothing exercises is a
      # guard measuring something nobody has checked.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: The boilerplate stripper removes a block whole
        run: |
          set -o pipefail
          node scripts/seo/check-duplicate-pages.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-duplicate-pages self-test:' >/dev/null

      # CAMP-66. Article 50(2) of the EU AI Act, in force 02.08.2026:
      # machine-made text has to be marked as machine-made. Thirty-six
      # guide pages are generated, nobody re-reads them, and a template
      # change that drops the disclosure looks like no change at all.
      #
      # 🔴 Two steps, as with every guard here. The self-test drives a
      # page with no provenance, one that never mentions a machine and
      # one that hides which machine — a gate nobody has tried to break
      # is a comment.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: Disclosure gate still refuses an unmarked generated page
        run: |
          set -o pipefail
          node scripts/seo/check-guide-disclosure.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-guide-disclosure self-test:' >/dev/null
      - name: Every guide says how it was made
        run: node scripts/seo/check-guide-disclosure.mjs

      # CAMP-37. Two steps, not one. The self-test proves the validator
      # still rejects broken markup — a checker that has quietly stopped
      # checking passes everything, and that is worse than no checker.
      # Only then is it worth believing the run against the real pages.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: Structured-data validator still catches breakage
        run: |
          set -o pipefail
          node scripts/seo/check-structured-data.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-structured-data self-test:' >/dev/null

      - name: JSON-LD validates against the schema.org vocabulary
        run: node scripts/seo/check-structured-data.mjs

      # CAMP-39. xmllint against the committed sitemaps.org schemas, then
      # the things a schema cannot express — chiefly that the sitemap and
      # the pages agree about indexing. The XML stays perfectly valid
      # while that is wrong, which is exactly why it needs its own check.
      - name: Sitemap validates against the sitemaps.org schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          xmllint --noout --schema scripts/seo/schemas/siteindex.xsd \
            apps/web/.next/server/app/sitemap.xml.body
          xmllint --noout --schema scripts/seo/schemas/sitemap.xsd \
            apps/web/.next/server/app/sitemaps/*.xml.body

      - name: Sitemap agrees with what the pages say
        run: node scripts/seo/check-sitemap.mjs --mode closed

      # CAMP-90. The build above was made closed; this proves all four
      # mechanisms actually are.
      - name: The whole site is closed to indexing
        run: node scripts/seo/check-indexing.mjs --expect closed

  # 🔴 CAMP-90. The same build, made public, checked the other way round.
  # The card's stated risk is `noindex` surviving into the real launch —
  # the classic way a site vanishes from the index. This job is the proof
  # that the switch flips, and it runs on every commit rather than being
  # discovered on launch day.
  public-build:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: camptribe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/build-site
        with:
          site-mode: public
          database-url: ${{ env.CI_DATABASE_URL }}

      - name: Nothing is left blocking the index
        run: node scripts/seo/check-indexing.mjs --expect public

      # CAMP-56. The legal pages may not go live unread.
      #
      # 🔴 Two steps, as with every guard here: first prove it still
      # refuses an unreviewed public build, then run it. Without the
      # first, a gate that has quietly stopped gating reports safety.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: Legal gate still refuses an unreviewed public build
        run: |
          set -o pipefail
          node scripts/seo/check-legal-review.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-legal-review self-test:' >/dev/null
      - name: Legal pages are reviewed, or the debt is still in date
        run: node scripts/seo/check-legal-review.mjs --expect public

      - name: Sitemap lists only indexable pages
        run: node scripts/seo/check-sitemap.mjs --mode public

  api:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    # CAMP-32 gave this job a database. The query plan for the map's
    # viewport query is part of the card's acceptance, and a plan can
    # only be read from a real planner with real statistics.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: camptribe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 🔴 24, unlike every other job here, and only because of Jest.
          # CAMP-159: Nest 12 is ESM-only, and Jest 30 can require() an ES
          # module only on Node >= 24.9. On 22 the same commit was red —
          # every spec that imports @nestjs/* died with "Must use import to
          # load ES Module" — while it was green on a Node 24 laptop. The API
          # itself is not affected: build-site starts it on Node 22 in the
          # jobs below, and the bypass probe runs there. apps/api/test/
          # require-node-24.cjs says the same thing out loud to a developer.
          node-version: 24
          cache: npm
      # 🔴 CAMP-258. Перенесення однієї таблиці на прод. 15.10.2026 я зробив
      # це руками через `pg_restore --clean -t`, перевірив кількість рядків
      # і види — усе збіглося з локальними до одиниці. А таблиця на 2,27 млн
      # рядків приїхала БЕЗ жодного індексу й без первинного ключа. Дамп,
      # знятий `pg_dump -t`, цілий; губить структуру `-t` НА ВІДНОВЛЕННІ: він
      # фільтрує записи TOC і лишає лише саму таблицю. Помітив через годину,
      # коли сусідній запит висів 4 хвилини 42 секунди.
      #
      # Самоперевірка: дві справжні бази, справжні pg_dump, pg_restore і psql,
      # а підмінник ssh запускає виконавця ТУТ. Виправлений скрипт `-t` на
      # відновленні не вживає, тож дефект у нормальному прогоні не
      # відтворюється; він з'являється, коли `-t` повернути, і тоді червоніють
      # перенесення, відкат і звірка схем. Заміна й відкат — одна транзакція;
      # відмови створює сам Postgres, а не підмінники: `pg_dump -t` не возить
      # типів і функцій, event trigger на проді змінює результат відновлення, а
      # читач і чужий DDL у вікні — окремі фонові psql, що чекають на подію в
      # pg_locks. Набору потрібні права суперкористувача (ролі, event trigger).
      #
      # Крок читає надруковане: рядок із власною назвою скрипта друкується
      # лише коли виконано рівно EXPECTED випадків, жоден не впав і жоден
      # не пропущено.
      - name: Moving one table to production keeps its indexes and its key
        env:
          CAMPTRIBE_SELFTEST_PG_BASE: postgres://postgres:postgres@localhost:5432
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          ./infra/move-table.selftest.sh | tee /dev/stderr \
            | grep -c 'move-table self-test: усе гаразд' >/dev/null

      # 🔴 CAMP-386. Нічний бекап вивантажував вісім CSV і жодної з 208
      # таблиць directus_* — а активація ліцензії Directus привʼязана до
      # directus_settings.project_id, якого в CSV не було. Тепер поруч
      # лягає повний pg_dump, і verify читає його ВМІСТ: набір підсовує
      # перевірці дамп без directus_* (файл є, сума правильна) і вимагає
      # червоного; відновлює дамп у другу базу й звіряє project_id.
      # Крок читає надруковане: рядок із власною назвою друкується лише
      # коли виконано рівно EXPECTED випадків і жоден не впав.
      - name: The nightly dump carries Directus, and verify reads its content
        env:
          CAMPTRIBE_SELFTEST_PG_BASE: postgres://postgres:postgres@localhost:5432
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          ./scripts/osm-pipeline/backup-local.selftest.sh | tee /dev/stderr \
            | grep -c 'backup-local dump self-test: усе гаразд' >/dev/null

      - run: npm ci

      # 🔴 CAMP-192: build TWICE and check it actually wrote files.
      #
      # One build proves nothing. With `incremental` on and nest-cli's
      # `deleteOutDir: true`, the SECOND build wipes dist, reads the
      # .tsbuildinfo, decides there is nothing to emit, and exits 0
      # having produced an empty dist. A green build with no output is
      # the worst shape a failure can take — everything downstream reads
      # it as success, and `nest start` dies on MODULE_NOT_FOUND.
      #
      # Measured 04.10.2026: with incremental on, pass 1 emitted and
      # pass 2 was empty. This step is that experiment, kept.
      # 🔴 The rehearsal runs FIRST, and it is not ceremony. Review of
      # this very guard found it green on the failure it was written for:
      # the bug was measured on a working copy a major version behind
      # package-lock.json, and does not reproduce on the toolchain this
      # job installs. A guard nobody has seen fail is a claim.
      #
      # This step proves the assertion still bites — it checks the check,
      # not the compiler, so it keeps working when Nest changes again.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: Build-emits guard still catches an empty dist
        run: |
          set -o pipefail
          ./scripts/ci/check-api-build-emits.sh --self-test | tee /dev/stderr \
            | grep -c 'check-api-build-emits self-test:' >/dev/null

      - run: ./scripts/ci/check-api-build-emits.sh

      # 🔴 The API was never linted in CI — only the web app was. Ten
      # formatting errors from CAMP-35 sat on main for a day and were
      # found by accident, while running lint by hand during a dependency
      # upgrade. A rule nobody enforces is a rule that quietly stops
      # applying, so it runs here now.
      #
      # --max-warnings=0 because a warning that never fails is a warning
      # nobody reads.
      - name: Lint the API
        working-directory: apps/api
        run: npx eslint "src/**/*.ts" --max-warnings=0

      - name: Migrate
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: npx typeorm-ts-node-commonjs migration:run -d src/data-source.ts

      # 🔴 CAMP-364: тести ПІСЛЯ міграцій, а не перед.
      #
      # `pages.service.spec.ts` саджає допис із МАЙБУТНЬОЮ датою в
      # транзакції й вимагає, щоб його не було видно — такий випадок не
      # можна написати над ненакатаною базою. Перед міграціями крок
      # падав би на відсутній таблиці, тобто на власній послідовності, а
      # не на дефекті.
      #
      # Змінної тут НЕМАЄ навмисно: спек бере `CI_DATABASE_URL`, яку
      # оголошено на рівні всього workflow — та сама конвенція, що в
      # `osm/import-main.db.spec.ts`. Перша редакція додавала сюди
      # `DATABASE_URL` і тим міняла середовище чужим тестам.
      - run: npm run test --workspace=apps/api

      # CAMP-32. Two steps, as with the structured-data validator: first
      # prove the check still fails when the index is taken away, then
      # believe the run that says it is used. A performance guard that
      # has stopped guarding reports green forever.
      - name: Query-plan check still catches a missing index
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
        run: |
          set -o pipefail
          npx ts-node src/spots/explain-map-queries.ts --self-test | tee /dev/stderr \
            | grep -c 'explain-map-queries self-test:' >/dev/null

      - name: Viewport query uses the spatial index at 55 000 rows
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: npx ts-node src/spots/explain-map-queries.ts

      # CAMP-35 names its own acceptance: "комбінація фільтрів дає той
      # самий набір, що й прямий SQL-запит". This is that check, and it
      # needs real rows — unlike the query-plan guard above, which builds
      # its own synthetic table.
      - name: Seed the fixture for the filter check
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d camptribe_test -v ON_ERROR_STOP=1 \
            -f apps/api/test/fixtures/ci-seed.sql
          echo "campsites: $(psql -h localhost -U postgres -d camptribe_test -t -A \
            -c 'SELECT count(*) FROM camping_spots')"

      # 🔴 CAMP-172. The seeded database IS the fixture, so this asks it
      # the question the fixture's regenerator would be asked in a year:
      # run the real _select.sql against it, append the real ci-seed-*.sql
      # files, and fail if any table ci-seed.sql seeds has no statement
      # left that produces it.
      #
      # It is here rather than only in a script somebody runs by hand
      # because the failure is discovered by whoever regenerates NEXT, weeks
      # after the card that appended a table to ci-seed.sql and forgot to
      # tell the generator. Here it is red the same day.
      #
      # Tables only, not rows: a database loaded from the fixture
      # legitimately selects fewer campsites than it holds (the campsite
      # marked gone is excluded by definition). The local run, against the
      # development database, is the one that compares row counts.
      - name: Every table the fixture seeds is still produced by its generator
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: ./apps/api/test/fixtures/regenerate.sh --check

      # Two steps again: first prove the comparison can fail, then believe
      # the run that says the generator and hand-written SQL agree.
      - name: Filter check still catches a mismatch
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
        run: |
          set -o pipefail
          npx ts-node src/spots/verify-filters.ts --self-test | tee /dev/stderr \
            | grep -c 'verify-filters self-test:' >/dev/null

      - name: Every filter combination matches a direct SQL query
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: npx ts-node src/spots/verify-filters.ts

      # CAMP-144. Two sources describe one campsite and we publish one
      # page; the join between the two rows lives in `spot_links`, which
      # no importer writes to. The requirement that made this card hard
      # is that the link must survive the weekly OSM import — so this
      # does not inspect the upsert's text, it RUNS the import against a
      # linked row and rolls it back.
      #
      # 🔴 It is not blind on a fresh fixture. `spot_links` is empty
      # here, and rather than skipping, the script creates a link inside
      # the transaction it is about to roll back — proven by hiding all
      # 2 986 real links and watching it take that path.
      - name: A source link survives the weekly import, and its invariants hold
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: npx ts-node src/spots/verify-links.ts

      # CAMP-281. The step above asks whether the link TABLE is sane;
      # this one asks whether the program that changes it behaves. The
      # two want opposite fixtures, which is why they are two scripts:
      # the invariants want the real database, and these build the shapes
      # they need, so they prove the same thing on an empty fixture as on
      # production.
      #
      # 🔴 It exists because the plan was twice not a fixed point — one
      # dry run did not describe the whole change, and the apply then
      # reported work nobody had been shown. Both times the only thing
      # that caught it was somebody rewinding the database by hand.
      - name: The fold script plans the whole change in one dry run
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: npx ts-node src/spots/verify-folds.ts

      - name: The fold script's twin arithmetic still agrees with itself
        working-directory: apps/api
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
        run: |
          set -o pipefail
          npx ts-node src/spots/fold-three-row-campsites.ts --self-test | tee /dev/stderr \
            | grep -c 'fold-three-row-campsites self-test:' >/dev/null

      # CAMP-282. The redirect map reached 80% of its edge budget with
      # nobody told, while the comment beside the cap still quoted 56%
      # from the first run. A ceiling that only speaks when it is hit is
      # not a budget — the message arrives in a red build, which is the
      # worst moment to choose between raising the cap and moving the
      # file out of the bundle.
      #
      # 🔴 Both boundaries are rehearsed rather than waited for: 75%
      # warns, over 100% throws, and the size is printed either way.
      # 🔴 The output is GREPPED, not merely produced.
      #
      # A review showed this step passing three ways while nothing ran:
      # the entry-point guard inverted, the flag renamed, and — with no
      # mutation at all — the script reached through a symlink, which
      # Node resolves on one side and not the other. "Did not start" and
      # "all seven passed" printed the same thing: nothing, exit 0.
      #
      # The script now refuses to exit quietly in all three cases. This
      # line is the second lock, and it is the one that does not depend
      # on the script being right about itself.
      - name: The edge budget still warns before it refuses
        working-directory: apps/web
        run: |
          # 🔴 pipefail, and without it this line was worse than useless.
          #
          # GitHub runs a step as `bash -e {0}` with NO pipefail, so the
          # exit code of a pipeline is the LAST command's — the grep's.
          # A review forced the summary line to claim success while nine
          # checks failed: node printed nine ✗ and exited 1, grep matched
          # the lying line, and the step went green. The grep closes
          # "did not start"; this closes "started and failed".
          set -o pipefail
          node scripts/edge-budget.mjs --self-test | tee /dev/stderr \
            | grep -c 'edge-budget boundaries, messages read' >/dev/null

      # CAMP-302. Чи може CommonJS-API завантажити ESM-фетчер.
      #
      # 🔴 Jest цього довести НЕ МОЖЕ — він виконує модулі у власній VM,
      # де динамічний імпорт ESM недоступний. Перша редакція служби
      # падала б у продакшні при першому ж оберті
      # (`ERR_REQUIRE_ASYNC_MODULE`), і жоден тест цього не бачив, бо
      # кожен підставляв свій завантажувач.
      - name: The CommonJS API can load the ESM warnings fetcher
        run: |
          set -o pipefail
          node apps/api/test/warnings-loader.probe.cjs | tee /dev/stderr \
            | grep -c 'warnings-loader probe:' >/dev/null

      # CAMP-289. Порожній перелік перейменувань — це збій, а не «змін
      # немає»: 13.10.2026 їх вісім на 721 живу сторінку, і записаний
      # порожній файл тихо перетворив би кожну з них на 404.
      - name: A region rename list is never legitimately empty
        working-directory: apps/web
        run: |
          set -o pipefail
          node scripts/gen-region-renames.mjs --self-test | tee /dev/stderr \
            | grep -c 'gen-region-renames self-test:' >/dev/null

      # CAMP-301. Порожній список 410 сьогодні ЗАКОННИЙ — у базі 5 945
      # зниклих рядків, найдавнішому 18 днів із 28, жоден не дозрів.
      # Приблизно 22.10.2026 перший дозріє, і з того дня та сама тиша
      # означатиме, що впав імпорт або зсунувся інтервал. Сторож, який
      # тоді мусить спрацювати, не можна перевірити тоді: до 22.10 він
      # мовчить правильно, а після — мовчатиме помилково, і відрізнити це
      # буде нічим. Тож репетиція, і саме зараз.
      - name: An empty 410 list is still explained by its reason
        working-directory: apps/web
        run: |
          # pipefail, як і сусід нижче: grep закриває «не стартувало»,
          # код виходу — «стартувало й упало». Без обох девʼять падінь
          # дали б зелений крок.
          set -o pipefail
          node scripts/gen-gone.mjs --self-test | tee /dev/stderr \
            | grep -c 'gen-gone self-test:' >/dev/null

      # CAMP-147. The card's own acceptance clause is "no displayed price
      # exists without a validity period", and the only thing enforcing it
      # in SQL is `DISPLAYABLE_TARIFF_SQL`. Until now the check that would
      # catch it breaking ran when a human remembered to run it.
      #
      # 🔴 Two steps, like the filter check above: first prove the
      # comparison can fail, then believe the run that says it passed. The
      # self-test plants an undated tariff inside a rolled-back
      # transaction and requires the SHIPPED read query to refuse it —
      # which is also what makes this meaningful on a fixture database
      # where `spot_tariffs` is empty and every invariant is trivially
      # zero.
      - name: Price check still catches an undated tariff
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
        run: |
          set -o pipefail
          npx ts-node src/datatourisme/verify-prices.ts --self-test | tee /dev/stderr \
            | grep -c 'verify-prices self-test:' >/dev/null

      # The reconciler's default is a dry run, and this is what proves it
      # stays one: the row count before and after must be identical.
      # `links.spec.ts` asserts the same thing statically; this asserts it
      # against a database, which is the half a regex cannot see.
      - name: The reconciler writes nothing without --apply
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          PGPASSWORD: postgres
        run: |
          # 🔴 pipefail, and it is the whole step.
          #
          # GitHub runs `run:` under `bash -e`, NOT `-o pipefail`. The
          # first version of this piped the reconciler through `tee`, so
          # the step's status was tee's — always 0 — and every failure of
          # the script was swallowed, INCLUDING the band-coverage throw
          # added in the same commit. That throw fires after the
          # "N cross-source pairs" line is printed, so the grep below
          # would still have matched and the step would have gone green
          # on a thrown error. A check that cannot fail is not a check.
          set -o pipefail
          before=$(psql -h localhost -U postgres -d camptribe_test -t -A \
            -c 'SELECT count(*) FROM camping_spots')
          npx ts-node src/spots/reconcile-sources.ts | tee /tmp/dry.txt
          after=$(psql -h localhost -U postgres -d camptribe_test -t -A \
            -c 'SELECT count(*) FROM camping_spots')
          links=$(psql -h localhost -U postgres -d camptribe_test -t -A \
            -c 'SELECT count(*) FROM spot_links')
          echo "campsites $before -> $after, links $links"
          test "$before" = "$after"
          test "$links" = "0"
          # 🔴 It must have LOOKED, and it must have MATCHED. Without the
          # first, a CANDIDATE_SQL returning nothing — a typo in the
          # join, a predicate excluding everything — passes exactly like
          # a correct one, because "wrote no rows" is true either way.
          # Without the second, the fixture proves only that the query
          # looked; the matcher could reject every pair and nothing would
          # say so. The fixture seeds a pair built to match.
          grep -qE '^[1-9][0-9]* cross-source pairs' /tmp/dry.txt \
            || { echo "✗ the dry run found no candidate pairs at all"; exit 1; }
          grep -qE 'link \(same name, same place\) +[1-9]' /tmp/dry.txt \
            || { echo "✗ the dry run proposed no links from a pair built to match"; exit 1; }

      # CAMP-103. The backup holds the only copy of what we cannot
      # download again — the computed context, which is rationed by
      # Open-Meteo's per-coordinate daily quota and therefore costs weeks
      # to rebuild. Its restore must never overwrite newer work with
      # older, and that rule is three WHERE clauses. This drives them
      # against temp tables; it was checked by removing the guard, which
      # makes it fail.
      - name: Restoring a backup cannot destroy newer work
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
        run: |
          set -o pipefail
          ./scripts/osm-pipeline/backup-local.sh --self-test | tee /dev/stderr \
            | grep -c 'backup-local self-test:' >/dev/null

      # 🔴 Runs on Linux, and that is half the point.
      #
      # The bug this suite was written for only exists on GNU coreutils:
      # `stat -f` there is --file-system, so it prints "? ?" and exits 0,
      # and every extract fingerprinted the same. It was invisible on the
      # macOS machine the script is developed on. A shell script that
      # runs in CI and is written on a Mac needs its tests on the runner,
      # not on the laptop.
      #
      # No network and no database: curl, osmium, ogr2ogr and psql are
      # shimmed on PATH. md5sum is not \u2014 the checksum is what is on trial.
      - name: An unverified extract can never load
        run: ./scripts/osm-pipeline/load-context.selftest.sh

      # 🔴 CAMP-119. The export list used to be a heredoc in
      # load-route-poi.sh and dropped `toilets`, `fee` and `shower` for
      # every object we hold — and a tag the export drops looks exactly
      # like a tag nobody wrote. This drives the script with the same
      # shims and asserts on the config osmium is actually handed.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: The stopping places are filtered for and exported with their tags
        run: |
          set -o pipefail
          ./scripts/osm-pipeline/load-route-poi.selftest.sh | tee /dev/stderr \
            | grep -c 'load-route-poi self-test:' >/dev/null

      # 🔴 CAMP-267. Thirteen of these cases exist because review showed
      # four different failures — a 404, a dead network, a redirect onto
      # the site index and an empty reply — producing one identical
      # sentence. A guard that names a cause it did not check is the
      # fault this repository keeps finding, and it is only caught by
      # running the stub against it.
      - name: Which Geofabrik file we are allowed to take
        run: ./scripts/osm-pipeline/geofabrik-url.selftest.sh

      # 🔴 CAMP-269. Сім випадків, із них три — різні поломки, і всі
      # мусять дати «будуємо». Ворота, що мовчки кажуть «ні», зупиняють
      # CI не падаючи.
      # 🔴 CAMP-285/286: the step reads the self-test's own output, under
      # `set -o pipefail` because Actions runs `bash -e {0}` without it.
      - name: Whether a run should build at all
        run: |
          set -o pipefail
          ./scripts/ci/should-build.sh --self-test | tee /dev/stderr \
            | grep -c 'should-build self-test:' >/dev/null

  e2e:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    # 🔴 МЕЖА ЧАСУ, БО БЕЗ НЕЇ ЗАВИСАННЯ КОШТУЄ ШІСТЬ ГОДИН РАННЕРА.
    #
    # Заміряно 26.10.2026: на PR #337 крок `playwright install --with-deps`
    # провисів 45+ хвилин замість звичних 40 СЕКУНД (замір на успішному
    # прогоні main 40279780478). Джоба не мала жодного обмеження, тож
    # мовчки йшла б до стандартної межі GitHub у 6 годин, і весь цей час
    # PR виглядав би як «CI ще йде».
    #
    # 75 хвилин — удвічі більше за справжній прогін (37 хв: установка 40 с,
    # збірка 83 с, самі тести 1996 с). Запас є, нескінченності немає.
    timeout-minutes: 75
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: camptribe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 🔴 APT І БРАУЗЕРИ РОЗДІЛЕНІ, БО ЗАВИСАЄ САМЕ APT.
      #
      # Заміряно 26.10.2026: `--with-deps` завис ТРИЧІ за день (#337, #347,
      # #348), при нормі 40 секунд. Лог щоразу доходив до
      # `Installing dependencies… Switching to root… Get:1
      # file:/etc/apt/apt-mirrors.txt` і там ставав. Повтор усього кроку не
      # допоміг — він повторював те саме зависання.
      #
      # Тому системні залежності тепер НЕ фатальні: образ ubuntu-latest від
      # GitHub уже несе бібліотеки, яких Playwright потребує. Якщо їх таки
      # забракне, браузер не запуститься — і це впаде ГУЧНО, на першому ж
      # тесті, з власним зрозумілим повідомленням. Червоний CI від чужого
      # дзеркала apt коштує дорожче за цей ризик.
      - name: System deps for browsers (not fatal — the apt mirror hangs)
        working-directory: apps/web
        timeout-minutes: 6
        continue-on-error: true
        run: |
          if timeout 240 npx playwright install-deps chromium firefox webkit; then
            echo "системні залежності встановлено"
          else
            echo "::warning::apt не відповів за 4 хв — покладаємось на образ раннера. Якщо браузер не запуститься, причина тут."
          fi

      - name: Install browsers
        working-directory: apps/web
        timeout-minutes: 8
        run: |
          for i in 1 2; do
            if timeout 210 npx playwright install chromium firefox webkit; then
              echo "браузери встановлено зі спроби $i"
              exit 0
            fi
            echo "::warning::спроба $i завантажити браузери не вдалась"
          done
          echo "::error::браузери не завантажились за дві спроби"
          exit 1
      - uses: ./.github/actions/build-site
        with:
          site-mode: closed
          database-url: ${{ env.CI_DATABASE_URL }}
          error-endpoint: ${{ env.CI_ERROR_ENDPOINT }}
      # Cross-browser (chromium/firefox/webkit) + cross-platform (desktop/mobile/tablet
      # viewports) + accessibility (axe-core, WCAG AA) + console-error capture — CAMP-13.
      # The API is still running from build-site: the tests resolve their
      # own fixtures from it rather than naming slugs (CAMP-39).
      # 🔴 CAMP-334. ПОВНА МАТРИЦЯ — НА ЗЛИТТІ, НЕ НА КОЖНОМУ ПУШІ.
      #
      # Заміряно за 7 діб (51 червоний прогін, 144 рядки падінь, 38
      # флуктуацій), по унікальних дефектах, які проєкт зловив сам-один:
      #
      #   mobile-chrome      4 дефекти    4 флуктуації
      #   firefox-desktop    3            2
      #   chromium-desktop   1            1
      #   webkit-desktop     0           31
      #
      # Жодного webkit-тільки дефекту за тиждень — і 82% усіх
      # флуктуацій, переважно таймаутами. Кожна червонить `check-flaky`
      # і коштує повний цикл CI.
      #
      # На `main` і на ручному запуску матриця повна, тож Safari-дефект
      # знайдеться перед деплоєм. На PR webkit мовчить.
      - run: npm run test:e2e --workspace=apps/web
        env:
          CI: true
          FULL_MATRIX: ${{ (github.ref_name == 'main' || github.event_name == 'workflow_dispatch') && '1' || '' }}
          API_BASE_URL: http://localhost:3001
          # CAMP-92. Reading client errors back is token-guarded; this is
          # the same throwaway value build-site gives the API it starts.
          CLIENT_ERRORS_READ_TOKEN: ci-read-token
          # 🔴 CAMP-69. The suite resolves its fixtures from the API and
          # asks the bulk routes tens of times a minute across six browser
          # projects — far past the public limit, and for the same reason
          # the build is exempt: these are our own callers, not the world.
          #
          # One test deliberately does NOT send it, and asserts the 429.
          # That is the card's acceptance criterion, and it would be
          # untestable if the limit were simply raised instead.
          API_BUILD_TOKEN: ci-build-token
          NEXT_PUBLIC_ERROR_ENDPOINT: ${{ env.CI_ERROR_ENDPOINT }}

      # 🔴 `always()`, and this is the point of the step. A flake leaves
      # the job green, so the check has to run on a green job too —
      # otherwise it only ever sees the runs that were already red.
      - name: No test passed only on a retry
        if: always()
        run: node scripts/ci/check-flaky.mjs apps/web/playwright-report/report.json

      # CAMP-60, debt #2. The API from build-site is still running. Ten
      # seconds at twenty concurrent: this asserts the API does not fall
      # over or start answering 200 with an empty body, and prints the
      # latencies rather than failing on them — a runner is a shared
      # machine and a latency budget tuned elsewhere only cries wolf.
      - name: The API holds up under concurrency
        env:
          API_BASE_URL: http://localhost:3001
          # 🔴 CAMP-69. This measures the API under load; the rate limiter
          # is measured separately, by a test that deliberately has no
          # token. Without this the first throttled run reported 35 910
          # non-2xx responses and excellent latency — a perfect score for
          # refusing to answer.
          API_BUILD_TOKEN: ci-build-token
        run: node scripts/load/load-test.mjs --profile smoke

      # 🔴 `always()`, А НЕ `failure()`, І ЦЕ ВИПРАВЛЕННЯ КОРПУСУ, НЕ
      # ЗРУЧНІСТЬ (CAMP-304). Поки звіт вивантажувався лише з прогонів,
      # що ВПАЛИ, будь-який замір тривалостей брав корпус, відібраний
      # падінням. А власний доказ того заміру — «усі 18 таймаутів у
      # webkit і firefox» — називає саме повільний рушій причиною
      # падінь. Тобто корпус відбирався тим самим полем, яке міряв.
      #
      # Рецензія назвала це прямо і дала ціну спростування: один рядок.
      # Тепер звіти є і з зелених прогонів, тож наступний замір можна
      # зробити на корпусі, який не знає, що саме він міряє.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # CAMP-60, debt #3. Visual regression on the pages where a CSS change
  # is invisible to every other test.
  #
  # 🔴 The baselines were generated on this runner and committed, because
  # a baseline is a rendering by a particular platform and every machine
  # we develop on is macOS while this is Linux. That is also why the
  # snapshot path carries {platform}: a locally generated file can never
  # be mistaken for the real baseline.
  #
  # To change them on purpose: change the page, let this job fail, read
  # the diff in the uploaded report, and only then re-run with
  # `--update-snapshots` and commit what comes back. Never update them to
  # make a red build green without looking at the diff — that is how a
  # visual suite becomes a rubber stamp.
  #
  # It earned its place on the first run: the very first baseline showed
  # "8 of 5 facilities recorded" on the home page, a real defect that
  # none of the 642 other tests could see.
  visual:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: camptribe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Та сама причина, що й у `e2e`: зависає apt, не завантаження.
      - name: System deps for chromium (not fatal — see the e2e job)
        working-directory: apps/web
        timeout-minutes: 6
        continue-on-error: true
        run: timeout 240 npx playwright install-deps chromium ||
          echo "::warning::apt не відповів за 4 хв — покладаємось на образ раннера"
      - run: timeout 210 npx playwright install chromium
        working-directory: apps/web
        timeout-minutes: 8
      - uses: ./.github/actions/build-site
        with:
          site-mode: closed
          database-url: ${{ env.CI_DATABASE_URL }}

      # The fixture is what makes screenshotting a data-driven site
      # possible: ci-seed.sql is the same rows on every run, so the
      # counts and names on these pages do not move.
      - name: Nothing looks different
        if: inputs.update-visual-baselines != true
        run: npm run test:visual --workspace=apps/web

      # 🔴 CAMP-197. `retries: 1` applies to this project too, so a visual
      # test can fail and then pass while the job stays green — and the
      # e2e job was the only one that read the report for it. This PR adds
      # a second full-page capture per test, which is new flake surface in
      # exactly the job that had no guard. Runs on failure too, because a
      # red job can still be hiding a retried test behind the red one.
      - name: A visual test that was retried did not pass quietly
        if: always() && inputs.update-visual-baselines != true
        run: node scripts/ci/check-flaky.mjs apps/web/playwright-report/report.json
        env:
          CI: true

      # On a failure this carries both the diff and the actual render, so
      # a change can be judged rather than rubber-stamped.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diff
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

      # Only on a manual run that asked for it. This never happens on a
      # push, so no branch can quietly rewrite its own baselines and go
      # green.
      - name: Regenerate the baselines
        if: inputs.update-visual-baselines == true
        run: npm run test:visual --workspace=apps/web -- --update-snapshots
        env:
          CI: true

      - uses: actions/upload-artifact@v7
        if: inputs.update-visual-baselines == true
        with:
          name: visual-baselines
          path: apps/web/tests/visual/__screenshots__/
          retention-days: 7

  lighthouse:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: camptribe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # 🔴 PUBLIC, unlike every other job here.
      #
      # Lighthouse's SEO category contains a "page is blocked from
      # indexing" audit, and a closed build fails it on every page: the
      # score lands at 0.63-0.66 and the assertion fails for a reason
      # that has nothing to do with the code. Scoring the SEO of a
      # deliberately-hidden site is meaningless anyway — what we need to
      # know is the score of what we will actually publish.
      #
      # Measured both ways on the same commit: closed 0.63, public 1.00.
      - uses: ./.github/actions/build-site
        with:
          site-mode: public
          database-url: ${{ env.CI_DATABASE_URL }}
      # Hard-fails on accessibility/SEO regressions (min score 0.9), warns on
      # performance/best-practices — thresholds in apps/web/lighthouserc.cjs,
      # whose URL list is computed from the built sitemap.
      - run: npm run lighthouse --workspace=apps/web
        env:
          NEXT_PUBLIC_SITE_MODE: public
