name: Watchdog

# CAMP-103: notice when a scheduled job stops happening.
#
# 🔴 Why this is a separate workflow and not a job inside the one it
# watches. `osm-weekly.yml` already has an `alert` job with
# `if: failure()`. That job fires when a run fails — it cannot fire when
# there is no run, and no run is exactly the state we were in: measured
# on 23.09.2026, `gh run list --workflow=osm-weekly.yml --event=schedule`
# returned nothing at all, while the Actions tab showed the workflow as
# active and healthy. A cron that stops, stops silently.
#
# Daily rather than weekly: a watchdog that checks as rarely as the thing
# it watches doubles the time to notice. This is a few seconds of runner
# time a day.
#
# 🔴 The hole that remains, said out loud rather than papered over:
# GitHub disables scheduled workflows in a repository after 60 days
# without activity, and it would disable this one alongside the job it
# watches. We commit most days, so it is not near — but the honest shape
# of the guarantee is "this catches a cron that broke", not "this catches
# a project that was abandoned". Nothing running inside GitHub can catch
# the second, because the thing that would report it is the thing that
# stopped.

on:
  schedule:
    # 08:00 UTC daily — four hours after the weekly job's slot, so a
    # Monday run has finished before the watchdog looks at it.
    - cron: '0 8 * * *'
    # Uptime: every three hours, at :23 (not on the hour — the top of the
    # hour is where GitHub's schedule queue is longest). 8 runs a day.
    # 🔴 The string is repeated in the `if:` of every job below, and the
    # two must match character for character: `github.event.schedule` is
    # the cron text, and a job whose `if:` names a different string runs
    # on EVERY tick instead of one.
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiet:
    runs-on: ubuntu-latest
    if: github.event.schedule != '23 */3 * * *'
    permissions:
      # To read other workflows' run history.
      actions: read
      # To open the issue when something has gone quiet.
      issues: write
    steps:
      - uses: actions/checkout@v7
      # Same pin as CI. The check needs no dependencies — node builtins
      # and `gh`, which the runner already has — so there is no npm ci.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The logic is tested here too, not only in CI. A watchdog that
      # ships broken to its own schedule is worse than no watchdog: it
      # reports "fine" by never reporting.
      - name: Prove the check works
      # 🔴 CAMP-285/286: the step reads the self-test's own output.
      # `set -o pipefail` because Actions runs `bash -e {0}` WITHOUT it,
      # so a failing node on the left of a pipe is invisible. The grepped
      # line names its own script, so no other self-test can satisfy it.
        run: |
          set -o pipefail
          node scripts/ci/check-schedule.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-schedule self-test:' >/dev/null

      - name: Look for silence
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/check-schedule.mjs
        continue-on-error: true

      - name: Open or update the silence issue
        if: steps.check.outputs.quiet == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.check.outputs.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='🔴 A scheduled job has gone quiet'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          FULL="$BODY

          Checked by: $RUN_URL

          This is the failure mode a failure alert cannot catch: there is
          no failing run to attach an alert to. Either the schedule was
          never reached, or it stopped."
          # One issue, updated — four identical issues a month get muted,
          # and a muted watchdog is worse than none.
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$FULL"
          else
            # No --label: the repository has no `ci` label and gh aborts
            # on an unresolvable one, so this branch — the one that runs
            # the very first time anything goes quiet — would have failed.
            gh issue create --title "$TITLE" --body "$FULL"
          fi

      # 🔴 Close the issue when the job recovers. An alert that stays open
      # after the problem is fixed teaches everyone to ignore it.
      - name: Close the silence issue once everything is running again
        if: steps.check.outputs.quiet != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE='🔴 A scheduled job has gone quiet'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --comment "Every watched job has run recently again. Closing."
          fi

  # CAMP-151: «запит удався і повернув архів» — це теж збій.
  #
  # 🔴 ОКРЕМА РОБОТА, А НЕ КРОК У `quiet`. Той сторож питає «чи
  # відбувався прогін»; цей питає «чи те, що прогін приніс, ще живе».
  # Державна служба може мовчати пʼять діб і далі віддавати HTTP 200 з
  # архівом — заміряно 13.10.2026: Австрія 34 блоки, чинних нуль,
  # остання публікація 119,5 години тому. Жоден із пʼяти сторожів
  # фетчера цього не бачить, бо всі вони судять про ПРОГІН, а не про
  # країну.
  #
  # 🔴 Окреме питання й окремий заголовок: змішати їх означало б, що
  # мовчазний cron і мовчазна метеослужба закривають одне одного.
  stale-sources:
    runs-on: ubuntu-latest
    if: github.event.schedule != '23 */3 * * *'
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 🔴 CAMP-285/286: крок ЧИТАЄ надруковане самотестом.
      # `set -o pipefail`, бо Actions запускає `bash -e {0}` БЕЗ нього,
      # і падіння node ліворуч від труби невидиме. Рядок, який грепаємо,
      # називає власний скрипт, тож чужий самотест його не задовольнить.
      - name: Prove the stall detector bites
        run: |
          set -o pipefail
          node scripts/ci/check-feed-stall.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-feed-stall self-test:' >/dev/null

      - name: Look for archives served as live data
        id: stall
        run: node scripts/ci/check-feed-stall.mjs
        continue-on-error: true

      - name: Open or update the stale-source issue
        if: steps.stall.outputs.stalled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.stall.outputs.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='🔴 A warning source is serving an archive'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          FULL="$BODY

          Checked by: $RUN_URL"
          # Одне питання, оновлюване. Чотири однакові на місяць вимикають.
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$FULL"
          else
            gh issue create --title "$TITLE" --body "$FULL"
          fi

      # 🔴 Закрити, коли джерела ожили. Тривога, що лишається відкритою
      # після зникнення проблеми, вчить ігнорувати наступну.
      - name: Close it once every source publishes again
        if: steps.stall.outputs.stalled != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE='🔴 A warning source is serving an archive'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --comment "Кожна точка знову віддає чинні записи. Закриваю."
          fi

  # CAMP-273: PR від dependabot, який стоїть червоний і якого ніхто не
  # відкрив.
  #
  # PR #29 (`@nestjs/core` 10 → 12) простояв пʼять діб: щодня було видно
  # «червоний», а ламався він в одному рядку `package.json` — решта пакетів
  # Nest лишились на мажорі 10. 14.10.2026 те саме з #156/#158 (react).
  #
  # ОКРЕМА РОБОТА. `quiet` питає «чи відбувався прогін», `stale-sources` —
  # «чи те, що він приніс, ще живе»; цей питає «чи хтось дивиться на PR,
  # який бот відкрив і лишив». Інше питання, інші права, інший результат:
  # не issue, а коментар у самому PR, де дивиться людина.
  #
  # Сторож читає діф маніфестів і НАЗИВАЄ пакети, що лишились на старому
  # мажорі, а не каже «схоже на неповний бамп». Логіка, пороги й чому саме
  # такі — у scripts/ci/check-dependabot-prs.mjs.
  dependabot-prs:
    runs-on: ubuntu-latest
    if: github.event.schedule != '23 */3 * * *'
    # Розклад і ручний запуск водночас створили б два коментарі раніше, ніж
    # котрийсь побачить другий. Другий чекає, а не скасовує першого.
    concurrency:
      group: watchdog-dependabot-prs
      cancel-in-progress: false
    permissions:
      # Читати діф, дерево репозиторію й маніфести PR.
      contents: read
      # Читати прогони й джоби за SHA голови.
      actions: read
      # Писати й правити коментар у PR. Для PR вистачає цього, без issues.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      # Той самий пін, що в сусідів. Залежностей немає — вбудовані модулі
      # Node й `gh`, який уже є на раннері, тож без `npm ci`.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # CAMP-285/286: крок ЧИТАЄ надруковане самотестом.
      # `set -o pipefail`, бо Actions запускає `bash -e {0}` БЕЗ нього.
      # Рядок, який грепаємо, називає власний скрипт.
      - name: Prove the dependabot-PR watchdog bites
        run: |
          set -o pipefail
          node scripts/ci/check-dependabot-prs.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-dependabot-prs self-test:' >/dev/null

      # Без `continue-on-error`: якщо зламався САМ сторож (запит не
      # відповів, відповідь без очікуваного масиву, фільтр осліп), червоний
      # крок і є сигнал. Коли він просто кричить у PR, крок зелений.
      - name: Look at the open dependabot PRs and comment where there is something to say
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/check-dependabot-prs.mjs --comment

  # Is the site answering at all. Nothing checked this before: measured on
  # 28.10.2026, `grep -rlE "curl.*camptribe\.eu|http_code"` over
  # `.github/workflows/` and the production units found nothing.
  #
  # 🔴 SEPARATE JOB, THREE-HOURLY TICK. The three jobs above are daily
  # questions; this one runs on its own cron and they skip that tick (see
  # the `if:` on each). A skipped job is not billed. Cost, counted not
  # guessed: 8 runs/day x 30.4 days = 243 runs a month, each billed as one
  # minute (Actions rounds a job UP to the whole minute and this one takes
  # seconds) = ~243 of the 2 000 minutes a private repository gets. Every
  # hour would be ~730 (36%); every minute would be ~43 800 and gone in
  # two days.
  #
  # What counts as down — and what does not — is in
  # scripts/ci/check-uptime.mjs: 200 and 401 are alive (the site is behind
  # Basic Auth today and answers 401; "expect 200" would shout daily and
  # be switched off), 5xx / 404 / DNS / refused / timeout / Cloudflare 1016 are
  # an outage.
  uptime:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 */3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Two overlapping runs would both fail to find the issue and open two.
    concurrency:
      group: watchdog-uptime
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 🔴 CAMP-285/286: the step reads the self-test's own output.
      # `set -o pipefail` because Actions runs `bash -e {0}` WITHOUT it.
      # The self-test serves 200/401/503/521/1016 from a local server and
      # points the same `probe` at a dead port and a name that cannot
      # resolve; a detector that has gone blind fails HERE, not in the
      # silence after the first real outage.
      - name: Prove the uptime detector bites
        run: |
          set -o pipefail
          node scripts/ci/check-uptime.mjs --self-test | tee /dev/stderr \
            | grep -c 'check-uptime self-test:' >/dev/null

      - name: Ask the site whether it is there
        id: uptime
        run: node scripts/ci/check-uptime.mjs
        continue-on-error: true

      - name: Open or update the outage issue
        if: steps.uptime.outputs.state == 'down'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.uptime.outputs.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='🔴 camptribe.eu is not answering'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          FULL="$BODY

          Checked by: $RUN_URL"
          # One issue per outage, a dated comment on each later failing
          # check. The comments are the evidence that it is still down.
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$FULL"
          else
            gh issue create --title "$TITLE" --body "$FULL"
          fi

      # 🔴 Closes only on an explicit `up`, not on "not down". If the check
      # itself crashed it wrote nothing, and `!= 'down'` would close a real
      # outage's issue because the detector fell over.
      - name: Close the outage issue once the site answers again
        if: steps.uptime.outputs.state == 'up'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE='🔴 camptribe.eu is not answering'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --comment "Обидві адреси знову відповідають (200 або 401). Закриваю."
          fi

      # The check crashed: no verdict either way. Say so with a red run
      # rather than a green one that looks like "up".
      - name: Fail if the check gave no verdict
        if: steps.uptime.outputs.state != 'up' && steps.uptime.outputs.state != 'down'
        run: |
          echo "::error::check-uptime.mjs wrote no verdict - the check itself is broken, the site state is unknown"
          exit 1
